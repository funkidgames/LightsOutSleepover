<!DOCTYPE html>

<style>

    background:rgba(255,255,255,.22);color:#fff;font-weight:bold;touch-action:none}
  #back{position:fixed;left:12px;top:10px;z-index:6;color:#fff;text-decoration:none;font-weight:bold;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:10px;font-size:14px}

<body>

<div id="ov"></div>

  <button id="tL" style="left:18px">◀</button>

  <button id="tJ" style="right:22px;width:100px;height:100px">⤒</button>
</div>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, T = 32, ROWS = 17;
const ov = document.getElementById('ov');
function fit(){ const s = Math.min(innerWidth/W, innerHeight/H); cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; }
addEventListener('resize', fit); fit();

// ------------------------------------------------------------------ history content
// Facts researched from the Canadian Encyclopedia, the Oakville Historical Society and Oakville News.
const WORLDS = [
  { name:'Sixteen Mile Creek', year:'Long before the town', theme:'creek', node:[575, 115],
    intro:'For thousands of years, Indigenous peoples lived along this shore: first the Huron-Wendat and other nations, and later the Mississaugas, an Anishinaabe people who fished and camped along the creeks.',
    fact:'In treaties signed in <b>1806</b> and <b>1820</b>, the Mississaugas gave up most of this land, including their reserves at the mouths of the Twelve and Sixteen Mile Creeks, to the British Crown. Oakville sits on the treaty lands of the <b>Mississaugas of the Credit First Nation</b>.',
    bonus:'The Huron-Wendat who lived in this area long ago were major suppliers of beaver pelts to the French fur traders of New France.' },
  { name:"Chisholm's Harbour", year:'1827', theme:'harbour', node:[548, 338],
    intro:'In 1827, a businessman named William Chisholm bought 960 acres of land at the mouth of Sixteen Mile Creek. He had a big plan: build a harbour and a town to ship grain across the lake.',
    fact:'Chisholm finished his harbour in <b>1828</b> and laid out the streets of the new town. In <b>1834</b> the harbour became an official Port of Entry, and soon it had a <b>shipbuilding yard</b> on Navy Street, a grist mill and grain storage.',
    bonus:'Oakville got its name from the many oak trees growing here. Oak wood was perfect for building ships and barrels.' },
  { name:'Freedom Harbour', year:'1830s – 1860s', theme:'freedom', node:[640, 380],
    intro:'Slavery was abolished in Canada in 1834. For people escaping slavery in the United States, the Oakville harbour was often their very first sight of freedom: a final stop on the Underground Railroad.',
    fact:'<b>Captain Robert Wilson</b> of Oakville used his ships to carry freedom seekers across Lake Ontario. His house still stands on <b>Navy Street</b>. Every year Oakville holds an <b>Emancipation Day</b> picnic at Erchless Estate to remember them.',
    bonus:'<b>James Wesley Hill</b> escaped from Maryland hidden in a packing box. He settled near Oakville, started a strawberry farm, and is said to have helped 700 to 800 people reach freedom.' },
  { name:'Old Town Oakville', year:'1857', theme:'town', node:[700, 280],
    intro:'The little harbour village kept growing. Shops, churches and brick houses filled the streets near the lake.',
    fact:'Oakville officially became a <b>Town in 1857</b>, and <b>George King Chisholm</b> was its first mayor. The Chisholm family home, <b>Erchless Estate</b>, is now the Oakville Museum.',
    bonus:'In 1915 and 1916, Lakeshore Road was paved with concrete. The Oakville Historical Society says it was the first paved highway in Ontario!' },
  { name:'Strawberry Fields', year:'1860s – 1900s', theme:'berry', node:[835, 190],
    intro:'Oakville farmers discovered that strawberries grew wonderfully here. Soon the fields around town were red with berries every summer.',
    fact:'In the 1860s <b>John Cross</b> started growing strawberries and making wooden berry baskets. By the mid-1870s, Oakville was the <b>top strawberry-growing district in all of Canada</b>.',
    bonus:'The <b>Oakville Basket Company</b> opened in 1892. It burned down in 1893 and again in 1920, was rebuilt both times, and kept making baskets until 1984.' },
  { name:'Bronte & the Big Merge', year:'1856 – 1962', theme:'bronte', node:[205, 400],
    intro:'West of Oakville was the fishing village of Bronte, with its own harbour at the mouth of Bronte Creek. North of town, farms covered Trafalgar Township.',
    fact:'Bronte built its harbour in <b>1856</b>. In <b>1962</b>, the Town of Oakville, the Village of Bronte and Trafalgar Township <b>joined together</b> to make the Oakville we know today.',
    bonus:'In the 1950s, a car company built a giant assembly plant on old farmland in Trafalgar Township. At first it employed about 5,600 people!' },
  { name:'Oakville Today', year:'Final world', theme:'today', node:[400, 190], boss:true,
    intro:'Oakville is now home to over 213,000 people. But a gloomy villain, the <b>Fog of Forgetting</b>, wants everyone to forget the town\'s history! Use everything you learned to stop it.',
    fact:'You collected the stories of Oakville: from the Mississaugas, to Chisholm\'s harbour, the Underground Railroad, the strawberry fields, Bronte and the town of today. <b>History lives on when we remember it!</b>',
    bonus:'Oakville is Ontario\'s 12th-largest municipality, and the Canadian Golf Hall of Fame is at Glen Abbey Golf Club.' },
];
const SOURCES = [
  ['The Canadian Encyclopedia: Oakville', 'https://thecanadianencyclopedia.ca/en/article/oakville'],
  ['Oakville Historical Society: Our Town', 'https://oakvillehistory.org/oakville'],
  ['Oakville News: The Underground Railroad in Oakville', 'https://oakvillenews.org/local-news/the-underground-railroad-oakville-8475638'],
  ['Town of Oakville: Oakville Museum history', 'https://www.oakville.ca/parks-recreation-culture/arts-culture/oakville-museum/museum-history/'],
];

// ------------------------------------------------------------------ save data
let save = { cleared:[], scrolls:[] };
try { const s = JSON.parse(localStorage.getItem('oakvilleQuest') || 'null'); if (s && Array.isArray(s.cleared)) save = s; } catch(e){}
function store(){ try { localStorage.setItem('oakvilleQuest', JSON.stringify(save)); } catch(e){} }

// ------------------------------------------------------------------ audio
let ac = null, muted = false, musicOn = true;
function audio(){ if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, d, type, v, f2, when){
  if (!ac || muted) return;
  const t0 = (when || ac.currentTime), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(v || 0.08, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
const sfx = {
  jump(){ tone(300, 0.18, 'square', 0.06, 620); },
  coin(){ tone(988, 0.07, 'square', 0.06); setTimeout(() => tone(1319, 0.18, 'square', 0.06), 70); },
  stomp(){ tone(200, 0.12, 'triangle', 0.15, 80); },
  bump(){ tone(140, 0.08, 'square', 0.08); },
  power(){ [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.06), i*70)); },
  hurt(){ tone(500, 0.35, 'sawtooth', 0.07, 120); },
  scroll(){ [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.09), i*110)); },
  clear(){ [523, 659, 784, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'square', 0.07), i*140)); },
  die(){ [494, 440, 392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.1), i*150)); },
  boss(){ tone(90, 0.6, 'sawtooth', 0.12, 45); },
};
// cheerful original chiptune: melody + bass, a different tempo and voice per theme
const MEL = [72,76,79,76,74,72,74,76, 77,76,74,72,71,72,74,0, 72,76,79,81,79,77,76,74, 72,74,76,74,72,71,72,0];
const BASS = [48,48,55,55,53,53,55,55];
const MUSIC = { map:[0.17,'triangle',0], creek:[0.2,'triangle',-5], harbour:[0.16,'square',0], freedom:[0.24,'triangle',-3],
  town:[0.15,'square',2], berry:[0.14,'square',4], bronte:[0.16,'square',-2], today:[0.13,'sawtooth',-7] };
let mStep = 0, mNext = 0, mTheme = 'map';
const mf = n => 440*Math.pow(2, (n - 69)/12);
setInterval(() => {
  if (!ac || muted || !musicOn) return;
  const [dur, wave, tr] = MUSIC[mTheme] || MUSIC.map;
  while (mNext < ac.currentTime + 0.12){
    if (mNext < ac.currentTime) mNext = ac.currentTime + 0.02;
    const n = MEL[mStep % MEL.length]; if (n) tone(mf(n + tr), dur*0.9, wave, 0.035, 0, mNext);
    if (mStep % 4 === 0) tone(mf(BASS[(mStep/4|0) % BASS.length] + tr), dur*3.5, 'triangle', 0.06, 0, mNext);
    mStep++; mNext += dur;
  }
}, 40);
document.getElementById('mute').onclick = e => { e.stopPropagation(); muted = !muted; e.target.textContent = muted ? '🔇' : '🔊'; };

// ------------------------------------------------------------------ input
const keys = {}, pressed = {};
addEventListener('keydown', e => { audio(); const k = e.key.toLowerCase(); if (!keys[k]) pressed[k] = true; keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault(); onKey(k); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const touch = { l:false, r:false, j:false };
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) document.getElementById('touch').style.display = 'block';
for (const [id, k] of [['tL','l'],['tR','r'],['tJ','j']]){
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); touch[k] = true; if (k === 'j') pressed.touchjump = true; if (state === 'map') onKey(k === 'l' ? 'arrowleft' : k === 'r' ? 'arrowright' : 'enter'); });
  for (const ev of ['pointerup','pointercancel','pointerleave']) b.addEventListener(ev, () => touch[k] = false);
}
cv.addEventListener('pointerdown', e => { audio(); if (state === 'map'){ const r = cv.getBoundingClientRect(), x = (e.clientX - r.left)*W/r.width, y = (e.clientY - r.top)*H/r.height;
  WORLDS.forEach((w, i) => { if (Math.hypot(w.node[0] - x, w.node[1] - y) < 30 && unlocked(i)){ if (mapSel === i) openIntro(i); else { mapSel = i; sfx.bump(); } } }); } });
const left = () => keys['arrowleft'] || keys['a'] || touch.l;
const right = () => keys['arrowright'] || keys['d'] || touch.r;
const jumpHeld = () => keys[' '] || keys['arrowup'] || keys['w'] || keys['z'] || touch.j;

// ------------------------------------------------------------------ helpers
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); }
function ell(x, y, rx, ry){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); ctx.fill(); }
function hash(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function leafPath(x, y, s){ // maple leaf
  ctx.beginPath();
  const pts = [[0,-1],[0.18,-0.62],[0.42,-0.75],[0.36,-0.38],[0.82,-0.48],[0.62,-0.18],[0.8,0.05],[0.32,0.12],[0.38,0.42],[0.06,0.3],[0.06,0.9],[-0.06,0.9],[-0.06,0.3],[-0.38,0.42],[-0.32,0.12],[-0.8,0.05],[-0.62,-0.18],[-0.82,-0.48],[-0.36,-0.38],[-0.42,-0.75],[-0.18,-0.62]];
  pts.forEach(([px, py], i) => i ? ctx.lineTo(x + px*s, y + py*s) : ctx.moveTo(x + px*s, y + py*s)); ctx.closePath();
}

// ------------------------------------------------------------------ the hero: Sprout the acorn explorer (original character)
function drawHero(x, y, dir, t, moving, air, powered, flash){
  if (flash && Math.sin(t*40) > 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  const step = moving && !air ? Math.sin(t*16) : 0;
  // maple-leaf cape when powered up
  if (powered){ ctx.fillStyle = '#d62828'; ctx.beginPath(); ctx.moveTo(-6, -22); ctx.quadraticCurveTo(-22 - Math.abs(step)*3, -6, -16 - (moving ? 6 : 0), 6 + Math.sin(t*10)*2); ctx.lineTo(-2, 0); ctx.fill();
    ctx.fillStyle = '#fff'; leafPath(-12, -6, 4); ctx.fill(); }
  // legs + boots
  ctx.fillStyle = '#4a3020'; rr(-8 + step*3, -6, 6, 8, 2); ctx.fill(); rr(2 - step*3, -6, 6, 8, 2); ctx.fill();
  ctx.fillStyle = '#2a1a10'; rr(-9 + step*3, 0, 9, 4, 2); ctx.fill(); rr(1 - step*3, 0, 9, 4, 2); ctx.fill();
  // green explorer tunic + belt + satchel strap
  ctx.fillStyle = '#2e8b3e'; rr(-10, -22, 20, 18, 6); ctx.fill();
  ctx.fillStyle = '#1e6a2c'; ctx.fillRect(-10, -9, 20, 3);
  ctx.strokeStyle = '#7a4a1a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, -21); ctx.lineTo(8, -8); ctx.stroke();
  // arms
  ctx.fillStyle = '#d9a35f'; circle(-10 - step*2, -12 + (air ? -6 : 0), 3.5); circle(10 + step*2, -12 + (air ? -8 : 0), 3.5);
  // acorn head
  ctx.fillStyle = '#d9a35f'; ell(0, -32, 11, 12);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ell(-4, -36, 4, 3);
  // eyes + smile + cheeks
  ctx.fillStyle = '#2a1a10'; ell(3, -32, 2, 3); ell(8, -32, 2, 3);
  ctx.fillStyle = '#fff'; circle(3.6, -33, 0.8); circle(8.6, -33, 0.8);
  ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(6, -27, 3, 0.2, Math.PI - 0.4); ctx.stroke();
  ctx.fillStyle = 'rgba(255,110,90,.5)'; circle(10, -28, 2);
  // acorn cap with crosshatch and stem
  ctx.fillStyle = '#6b4423'; ctx.beginPath(); ctx.ellipse(0, -39, 13, 7, 0, Math.PI, 0); ctx.lineTo(13, -38); ctx.quadraticCurveTo(0, -35, -13, -38); ctx.fill();
  ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 1; for (let i=-10;i<=10;i+=5){ ctx.beginPath(); ctx.moveTo(i - 3, -44); ctx.lineTo(i + 3, -37); ctx.stroke(); }
  ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -45); ctx.quadraticCurveTo(3, -50, 6, -50); ctx.stroke();
  // red scarf with flutter
  ctx.fillStyle = '#d62828'; rr(-9, -24, 18, 4, 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-7, -23); ctx.lineTo(-16, -21 + Math.sin(t*12)*3); ctx.lineTo(-14, -17 + Math.sin(t*12)*3); ctx.lineTo(-6, -20); ctx.fill();
  ctx.restore();
}

// ------------------------------------------------------------------ themes
const THEMES = {
  creek:   { sky:['#8fd3ff','#d8f1ff'], ground:'#5a8a3a', dirt:'#6b4a2a', block:'#8a6a3a', foes:['turtle','mosquito','turtle'] },
  harbour: { sky:['#7ac4f0','#e2f4ff'], ground:'#8a6a44', dirt:'#5a4028', block:'#a07a4a', foes:['crab','gull','barrel'] },
  freedom: { sky:['#0b1640','#2a3f7a'], ground:'#4a5a6a', dirt:'#2a3440', block:'#6a7a8a', foes:['wave','storm','wave'] },
  town:    { sky:['#ffcf9a','#fff0d8'], ground:'#9a9a9a', dirt:'#7a4a3a', block:'#b5523a', foes:['jalopy','pigeon','jalopy'] },
  berry:   { sky:['#9fe0ff','#e8fbff'], ground:'#4caf50', dirt:'#7a4a2a', block:'#c9893a', foes:['slug','crow','basket'] },
  bronte:  { sky:['#9ac8e8','#eef6ff'], ground:'#6a7a8a', dirt:'#4a4a52', block:'#8a8a96', foes:['bot','gull','tire'] },
  today:   { sky:['#6a6a8a','#c8c8d8'], ground:'#5a6a5a', dirt:'#3a3a44', block:'#6a6a7a', foes:['fogling','fogling','fogling'] },
};
function drawBackground(theme, camX, t){
  const th = THEMES[theme];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const par = (f, w) => ((-camX*f) % w + w) % w - w;
  if (theme === 'freedom'){
    for (let i=0;i<70;i++){ ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.5*Math.abs(Math.sin(t + i))})`; ctx.fillRect((hash(i)*W*1.5 - camX*0.03) % W, hash(i+9)*300, 2, 2); }
    ctx.save(); ctx.shadowColor = '#fff6a0'; ctx.shadowBlur = 24; ctx.fillStyle = '#fffbd0'; circle(780, 120, 6); ctx.restore();
    ctx.fillStyle = 'rgba(255,250,200,.85)'; ctx.font = 'bold 13px "Trebuchet MS"'; ctx.fillText('North Star', 795, 124);
  } else if (theme === 'today'){
    for (let i=0;i<6;i++){ const x = par(0.1, 320) + i*320; ctx.fillStyle = 'rgba(240,240,250,.6)'; ell(x + 100, 80 + (i%2)*30, 120, 26); }
  } else { ctx.fillStyle = 'rgba(255,255,255,.85)'; for (let i=0;i<6;i++){ const x = par(0.08, 360) + i*360; ell(x + 80, 70 + (i%3)*25, 50, 16); ell(x + 115, 60 + (i%3)*25, 34, 14); } }
  // far layer
  const far = par(0.25, 480);
  for (let k=0;k<4;k++){
    const bx = far + k*480;
    ctx.save(); ctx.translate(bx, 0);
    if (theme === 'creek'){ ctx.fillStyle = '#3f7a3a'; for (let i=0;i<8;i++){ ell(i*60 + 20, 330, 45, 70); } ctx.fillStyle = '#5a3a1a'; for (let i=0;i<8;i++) ctx.fillRect(i*60 + 16, 360, 8, 80);
      ctx.fillStyle = '#4aa0d8'; ctx.fillRect(0, 410, 480, 30); ctx.fillStyle = 'rgba(255,255,255,.5)'; for (let i=0;i<6;i++) ctx.fillRect(i*80 + ((t*30) % 80), 420, 30, 2);
      ctx.fillStyle = '#8a5a2a'; ctx.beginPath(); ctx.moveTo(300, 405); ctx.quadraticCurveTo(340, 418, 380, 405); ctx.lineTo(372, 400); ctx.lineTo(308, 400); ctx.fill(); }
    if (theme === 'harbour' || theme === 'bronte'){ ctx.fillStyle = '#3a8ac8'; ctx.fillRect(0, 380, 480, 70);
      ctx.fillStyle = '#5a3a1a'; ctx.beginPath(); ctx.moveTo(120, 380); ctx.lineTo(260, 380); ctx.lineTo(245, 398); ctx.lineTo(135, 398); ctx.fill();
      ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(170, 380); ctx.lineTo(170, 290); ctx.moveTo(215, 380); ctx.lineTo(215, 300); ctx.stroke();
      ctx.fillStyle = '#f4ecd8'; ctx.beginPath(); ctx.moveTo(172, 295); ctx.lineTo(210, 372); ctx.lineTo(172, 372); ctx.fill(); ctx.beginPath(); ctx.moveTo(217, 305); ctx.lineTo(250, 372); ctx.lineTo(217, 372); ctx.fill();
      if (theme === 'harbour'){ ctx.fillStyle = '#8a5a3a'; ctx.fillRect(340, 300, 110, 80); ctx.fillStyle = '#6a3a2a'; ctx.beginPath(); ctx.moveTo(332, 302); ctx.lineTo(395, 262); ctx.lineTo(458, 302); ctx.fill();

// ------------------------------------------------------------------ level generation
function buildLevel(wi){

  const ents = [];

    const cols = 30, g = [];
    for (let r=0;r<ROWS;r++){ g.push(Array(cols).fill('.')); }
    for (let c=0;c<cols;c++) for (let r=14;r<ROWS;r++) g[r][c] = '#';
    for (let r=0;r<ROWS;r++){ g[r][0] = '#'; g[r][cols-1] = '#'; }
    for (const [c, r] of [[6,10],[7,10],[22,10],[23,10]]) g[r][c] = '=';
    g[10][14] = '?'; g[10][15] = '?';
    return { g, cols, ents, start:[3, 13], goal:null, theme:w.theme, boss:true };
  }
  const cols = 150 + wi*14, g = [];
  for (let r=0;r<ROWS;r++) g.push(Array(cols).fill('.'));
  for (let c=0;c<cols;c++) for (let r=14;r<ROWS;r++) g[r][c] = '#';
  const scrollAt = Math.floor(cols*0.55);
  let x = 14, qCount = 0;
  const foe = (c, r, kind) => ents.push({ type:'foe', kind, x:c*T + 16, y:r*T, vx:-1, seed:R()*10 });
  while (x < cols - 26){
    if (Math.abs(x - scrollAt) < 6){
      for (let c=scrollAt-2;c<=scrollAt+1;c++) g[11][c] = '=';
      ents.push({ type:'scroll', x:scrollAt*T, y:9*T + 16 }); x = scrollAt + 6; continue;
    }
    const roll = R();
    if (roll < 0.22){ // gap
      const gw = 2 + Math.floor(R()*(1.6 + d*2));
      for (let c=x;c<x+gw;c++) for (let r=14;r<ROWS;r++) g[r][c] = r === 16 ? 'w' : '.';
      if (R() < 0.5) for (let c=x;c<x+gw;c++) ents.push({ type:'acorn', x:c*T + 16, y:10*T + 16 });
      x += gw + 3;
    } else if (roll < 0.42){ // floating platform with acorns
      const len = 3 + Math.floor(R()*3), row = R() < 0.5 ? 11 : 10;
      for (let c=x;c<x+len;c++){ g[row][c] = '='; ents.push({ type:'acorn', x:c*T + 16, y:(row-1)*T + 16 }); }
      if (R() < 0.4 + d*0.4) foe(x + len - 1, 14, th.foes[0]);
      x += len + 3;
    } else if (roll < 0.58){ // question blocks
      const row = 10, n = 1 + Math.floor(R()*3);
      for (let c=x;c<x+n+2;c++) g[row][c] = 'b';
      for (let i=0;i<n;i++){ g[row][x + 1 + i] = '?'; qCount++; }
      if (R() < 0.6) foe(x + 2, 14, th.foes[2]);
      x += n + 6;
    } else if (roll < 0.72){ // stairs up and down
      const h = 2 + Math.floor(R()*(1 + d*2));
      for (let i=0;i<h;i++) for (let r=13-i;r<14;r++){ g[r][x + i] = 'b'; g[r][x + 2*h - i] = 'b'; }
      for (let r=13-h+1;r<14;r++) g[r][x + h] = 'b';
      ents.push({ type:'acorn', x:(x + h)*T + 16, y:(13 - h)*T - 4 });
      x += 2*h + 4;
    } else if (roll < 0.86){ // enemies on open ground
      const n = 1 + Math.floor(R()*(1 + d*2.5));
      for (let i=0;i<n;i++) foe(x + 2 + i*3, 14, th.foes[i % 2 === 0 ? 0 : 2]);
      x += n*3 + 4;
    } else { // flying foe over a pillar
      const ph = 2 + Math.floor(R()*2);
      for (let r=14-ph;r<14;r++){ g[r][x] = 'b'; g[r][x+1] = 'b'; }
      ents.push({ type:'foe', kind:th.foes[1], x:(x + 6)*T, y:(8 + Math.floor(R()*3))*T, vx:-1, seed:R()*10, fly:true, baseY:(9 + R()*2)*T });
      x += 9;
    }
  }
  const goal = cols - 9;

}

  if (state === 'map'){
    if ((k === 'arrowright' || k === 'd' || k === 'arrowup') && mapSel < WORLDS.length - 1 && unlocked(mapSel + 1)){ mapSel++; sfx.bump(); }
    if ((k === 'arrowleft' || k === 'a' || k === 'arrowdown') && mapSel > 0){ mapSel--; sfx.bump(); }
    if (k === 'enter' || k === ' ') openIntro(mapSel);
    if (k === 'h') historyBook();
  } else if (state === 'play' && k === 'escape'){ toMap(); }
  else if ((state === 'title' || state === 'card') && k === 'enter'){ const b = ov.querySelector('button'); if (b) b.click(); }
}

// ------------------------------------------------------------------ cards
function showOv(html){ ov.innerHTML = `<div class="card">${html}</div>`; ov.classList.remove('hidden'); }
function hideOv(){ ov.classList.add('hidden'); }
function bind(id, fn){ const el = document.getElementById(id); if (el) el.onclick = e => { e.stopPropagation(); audio(); fn(); }; }
function title(){
  state = 'title'; mTheme = 'map';
  showOv(`<h1>🌰 Oakville Quest 🍁</h1><p class="year">A history adventure</p>
    <p>Meet <b>Sprout</b>, a brave little acorn explorer! Travel across the map of Oakville, Ontario, and jump through <b>7 worlds</b> of real town history, from the Sixteen Mile Creek to the town of today.</p>
    <p>Find the hidden <b>📜 History Scroll</b> in each world, collect acorns, grab <b>🍁 Maple Leaf</b> capes from the leaf blocks, and reach the <b>heritage plaque</b> to clear each world. Then defeat the <b>Fog of Forgetting</b> to conquer Oakville!</p>
    <p class="small">Move: ◀ ▶ or A/D · Jump: SPACE, ↑ or W (hold to jump higher) · Stomp critters from above · ESC: back to map</p>
    <button id="bGo">Start the adventure ▶</button><button class="alt" id="bBook">📖 History Book</button>
    ${save.cleared.length ? '<br><button class="alt" id="bReset" style="font-size:13px;padding:6px 12px">Start over</button>' : ''}`);
  bind('bGo', toMap); bind('bBook', historyBook);
  bind('bReset', () => { save = { cleared:[], scrolls:[] }; store(); mapSel = 0; title(); });
}
function toMap(){
  state = 'map'; mTheme = 'map'; hideOv(); lvl = null;
  if (!mapHero.x){ mapHero.x = WORLDS[mapSel].node[0]; mapHero.y = WORLDS[mapSel].node[1]; }
}
function openIntro(i){
  if (!unlocked(i)) return;
  const w = WORLDS[i]; state = 'card';
  showOv(`<h2>World ${i + 1}: ${w.name}</h2><span class="year">${w.year}</span><p>${w.intro}</p>
    ${w.boss ? '<p class="small">Boss: the fog floats out of reach, so wait for it to <b>swoop down</b>, then jump on its head 3 times. Dodge its fog balls!</p>' : '<p class="small">Find the hidden 📜 History Scroll for a bonus fact!</p>'}
    <button id="bPlay">Play ▶</button><button class="alt" id="bBack">Back to map</button>`);
  bind('bPlay', () => { hero = null; startLevel(i); }); bind('bBack', toMap);
}
function levelDone(){
  const i = cur, w = WORLDS[i], first = !save.cleared.includes(i);
  if (first) save.cleared.push(i); if (gotScroll && !save.scrolls.includes(i)) save.scrolls.push(i); store();
  if (i < WORLDS.length - 1 && mapSel === i) mapSel = Math.min(WORLDS.length - 1, i + 1);
  state = 'card'; mTheme = 'map';
  if (w.boss){
    showOv(`<h1>🏆 You conquered Oakville! 🏆</h1><p class="year">The Fog of Forgetting is gone</p>
      <div class="fact">${w.fact}</div><div class="fact">🌳 <b>Fun fact:</b> ${w.bonus}</div>
      <p>Sprout is now the official <b>Keeper of Oakville's History</b>! 🌰🍁</p>
      <p class="small">History Scrolls found: ${save.scrolls.length}/6. ${save.scrolls.length < 6 ? 'Replay worlds to find the rest!' : 'You found them all. Amazing!'}</p>
      <button id="bMap">Back to the map</button><button class="alt" id="bBook">📖 History Book</button>`);
  } else {
    showOv(`<h2>🎉 World ${i + 1} clear!</h2><span class="year">${w.name} · ${w.year}</span>
      <div class="fact">🏛️ <b>History unlocked:</b><br>${w.fact}</div>
      ${gotScroll ? `<div class="fact">📜 <b>History Scroll bonus:</b><br>${w.bonus}</div>` : '<p class="small">You missed the 📜 History Scroll in this world. Play again to find its bonus fact!</p>'}
      <p class="small">Acorns: ${acorns} · Lives: ${lives}</p>
      <button id="bMap">Continue ▶</button>`);
  }
  bind('bMap', toMap); bind('bBook', historyBook);
}
function gameOver(){
  state = 'card'; mTheme = 'map';
  showOv(`<h2>Out of lives!</h2><p>Don't worry, Sprout never gives up. Your cleared worlds are saved, and you get 5 fresh lives.</p><button id="bMap">Back to the map</button>`);
  bind('bMap', toMap);
}
function historyBook(){
  const prev = state; state = 'card';
  const items = WORLDS.map((w, i) => save.cleared.includes(i)
    ? `<li><b>${w.name} (${w.year}):</b> ${w.fact}${save.scrolls.includes(i) ? `<br>📜 ${w.bonus}` : ''}</li>`
    : `<li style="opacity:.55"><b>${w.name}</b>: 🔒 Clear this world to unlock its story.</li>`).join('');
  showOv(`<h2>📖 Oakville History Book</h2><ol>${items}</ol>
    <p class="small">Sources: ${SOURCES.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(' · ')}</p>
    <button id="bClose">Close</button>`);
  bind('bClose', () => { if (prev === 'map') toMap(); else title(); });
}

// ------------------------------------------------------------------ main loop
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  ctx.clearRect(0, 0, W, H);
  if (state === 'play' || state === 'done'){ if (state === 'play') update(dt); if (lvl) drawLevel(); }
  else { drawMap(now/1000); }
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(frame);
}
mapHero.x = WORLDS[0].node[0]; mapHero.y = WORLDS[0].node[1];
title();
requestAnimationFrame(frame);
window.__oq = { get state(){ return state; }, get hero(){ return hero; }, get lvl(){ return lvl; }, get boss(){ return boss; }, get foes(){ return foes; }, startLevel, toMap, get save(){ return save; }, buildLevel };
</script>
</body>
</html>
