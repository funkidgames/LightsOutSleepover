<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Goal Rush Soccer · FunKid Games</title>
<!-- Vercel Web Analytics -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<meta name="description" content="Goal Rush Soccer: fast arcade soccer. Play the computer or a friend on the same screen.">
<style>
  :root{ --bg:#120f26; --ink:#f4f0ff; --muted:#aaa3d8; --accent:#ffd23f; --card:#1f1a3f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#141130;color:var(--ink);
    font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hide{display:none!important}

  /* scoreboard */
  #hud{position:fixed;top:6px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:2}
  .sb{display:flex;align-items:center;background:rgba(10,8,30,.85);border-radius:14px;padding:4px 8px;gap:8px;box-shadow:0 4px 14px #0007;border:2px solid #ffffff14}
  .tm{display:flex;align-items:center;gap:5px;font-weight:900;font-size:14px;white-space:nowrap}
  .tm .em{font-size:22px;line-height:1}
  .chip{width:12px;height:12px;border-radius:50%;border:2px solid #fff;flex:none}
  .mid{display:flex;flex-direction:column;align-items:center;line-height:1}
  .score{font-size:26px;font-weight:900;letter-spacing:2px;min-width:64px;text-align:center}
  .clock{font-size:13px;font-weight:bold;color:var(--accent);margin-top:2px}
  .clock.gold{color:#ff8a3d}
  .bump{animation:bump .5s}
  @keyframes bump{40%{transform:scale(1.5)}}
  .ibtn{position:fixed;top:8px;width:40px;height:36px;border:0;border-radius:10px;background:rgba(10,8,30,.78);color:#fff;font-size:18px;cursor:pointer;z-index:3}
  #pauseBtn{right:8px} #soundBtn{right:54px}

  /* banner */
  #banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:4;font-weight:900;
    font-size:clamp(34px,10vw,84px);color:#fff;text-shadow:0 5px 0 #0009,0 0 24px #ffd23f88;opacity:0}
  #banner small{display:block;font-size:.32em;margin-top:6px;color:var(--accent)}
  #banner.show{animation:pop 1.6s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-6deg)}15%{opacity:1;transform:scale(1.15) rotate(2deg)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

  /* overlays */
  .ov{position:fixed;inset:0;display:flex;z-index:5;padding:12px;background:rgba(8,6,24,.55);overflow:auto;touch-action:pan-y}
  .panel{background:linear-gradient(160deg,#2a2160,#171334);border-radius:24px;padding:16px 18px 18px;max-width:560px;width:100%;
    box-shadow:0 20px 50px #000a;border:2px solid #ffffff1a;margin:auto}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .back{color:var(--muted);text-decoration:none;font-weight:bold;font-size:15px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06);white-space:nowrap}
  .back:hover{color:var(--ink);background:rgba(255,255,255,.12)}
  .smallbtn{border:0;background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-weight:bold;font-size:15px;padding:8px 12px;border-radius:10px;cursor:pointer}
  h1{margin:8px 0 2px;text-align:center;font-size:clamp(36px,10vw,58px);font-weight:900;line-height:1;letter-spacing:1px;
    filter:drop-shadow(0 4px 0 #0007)}
  h1 .grad{background:linear-gradient(90deg,#7be36b,#ffd23f,#ff7ab6);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .ball{display:inline-block;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sub{text-align:center;color:var(--muted);margin:0 0 12px}
  .lbl{font-size:13px;font-weight:bold;color:var(--muted);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:1px}
  .seg{display:flex;background:rgba(255,255,255,.07);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:bold;font-size:15px;padding:9px 4px;border-radius:10px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#2a1a00;box-shadow:0 3px 0 #a07800}
  .teams{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .teams button{border:3px solid transparent;background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-weight:bold;font-size:13px;
    padding:6px 4px 7px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1}
  .teams button .em{font-size:26px}
  .teams button .kit{display:flex;gap:3px}
  .teams button .kit i{width:12px;height:12px;border-radius:50%;border:2px solid #fff8}
  .teams button.on{border-color:var(--accent);background:rgba(255,210,63,.14)}
  .teams button:disabled{opacity:.3;cursor:not-allowed}
  .big{display:block;width:100%;margin-top:16px;border:0;border-radius:16px;background:linear-gradient(#ffe36b,#ffc21a);color:#2a1a00;font:inherit;
    font-weight:900;font-size:24px;padding:14px;cursor:pointer;box-shadow:0 5px 0 #a07800;letter-spacing:1px}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #a07800}
  .big.alt{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:0 5px 0 #0006;font-size:19px;margin-top:10px}
  .rec{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}
  .help{font-size:13px;color:var(--muted);line-height:1.5;margin-top:12px;background:rgba(0,0,0,.2);border-radius:12px;padding:8px 12px}
  .help b{color:var(--ink)}
  kbd{background:#ffffff1c;border-radius:5px;padding:0 5px;font-family:inherit;font-weight:bold;color:var(--ink)}
  .res-em{font-size:72px;text-align:center;line-height:1;margin-top:6px;animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px)}}
  .res-title{text-align:center;font-size:clamp(30px,8vw,44px);font-weight:900;margin:8px 0 4px;color:var(--accent);text-shadow:0 4px 0 #0008}
  .res-score{text-align:center;font-size:20px;font-weight:bold;margin:6px 0}
  .res-score b{font-size:30px;margin:0 8px}
  .tip{text-align:center;color:#ffd23f;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div class="sb">
    <div class="tm" id="hudT0"><span class="em"></span><span class="chip"></span><span class="nm"></span></div>
    <div class="mid"><div class="score" id="hudScore">0 - 0</div><div class="clock" id="hudClock">2:00</div></div>
    <div class="tm" id="hudT1"><span class="nm"></span><span class="chip"></span><span class="em"></span></div>
  </div>
</div>
<button class="ibtn hide" id="pauseBtn" aria-label="Pause">⏸</button>
<button class="ibtn hide" id="soundBtn" aria-label="Sound">🔊</button>
<div id="banner"></div>

<!-- MENU -->
<div class="ov" id="menu">
  <div class="panel">
    <div class="toprow">
      <a class="back" href="/">⬅ All games</a>
      <button class="smallbtn" id="menuSound">🔊 Sound on</button>
    </div>
    <h1><span class="ball">⚽</span> <span class="grad">GOAL RUSH</span></h1>
    <p class="sub">Fast arcade soccer. Pass, shoot, score!</p>

    <div class="seg" id="modeSeg">
      <button data-v="cpu">🤖 vs Computer</button>
      <button data-v="2p">👫 2 Players</button>
    </div>

    <div class="lbl" id="lbl0">Your team</div>
    <div class="teams" id="pick0"></div>
    <div class="lbl" id="lbl1">Computer team</div>
    <div class="teams" id="pick1"></div>

    <div id="levelWrap">
      <div class="lbl">Level</div>
      <div class="seg" id="levelSeg">
        <button data-v="easy">😊 Easy</button><button data-v="normal">😎 Normal</button><button data-v="hard">🔥 Hard</button>
      </div>
    </div>
    <div class="lbl">Match length</div>
    <div class="seg" id="lenSeg">
      <button data-v="1">1 min</button><button data-v="2">2 min</button><button data-v="3">3 min</button>
    </div>

    <button class="big" id="startBtn">KICK OFF! ⚽</button>
    <div class="rec" id="recLine"></div>
    <div class="help" id="helpBox"></div>
  </div>
</div>

<!-- PAUSE -->
<div class="ov hide" id="pause">
  <div class="panel" style="max-width:420px">
    <h1 style="font-size:40px">Paused</h1>
    <button class="big" id="resumeBtn">▶ Keep playing</button>
    <button class="big alt" id="restartBtn">🔄 Restart match</button>
    <button class="big alt" id="quitBtn">🏠 Menu</button>
    <div class="help" id="helpBox2"></div>
  </div>
</div>

<!-- RESULT -->
<div class="ov hide" id="result">
  <div class="panel" style="max-width:460px">
    <div class="res-em" id="resEm">🏆</div>
    <div class="res-title" id="resTitle">YOU WIN!</div>
    <div class="res-score" id="resScore"></div>
    <div class="rec" id="resRec"></div>
    <button class="big" id="againBtn">⚽ Play again</button>
    <button class="big alt" id="menuBtn">🏠 Menu</button>
  </div>
</div>

<script>
(() => {
'use strict';
/* ================= constants ================= */
const W = 900, H = 560, CX = W/2, CY = H/2;
const MOUTH = 150, GY0 = CY - MOUTH/2, GY1 = CY + MOUTH/2, GD = 34;
const PR = 15, BR = 8, SPEED = 195;
const VX0 = -64, VY0 = -46, VW = W + 128, VH = H + 92;
const TEAMS = [
  {name:'Thunder Foxes', short:'Foxes',   em:'🦊', c1:'#ff7a1a', c2:'#ffffff'},
  {name:'Wave Sharks',   short:'Sharks',  em:'🦈', c1:'#2f7bff', c2:'#bfe6ff'},
  {name:'Lava Lions',    short:'Lions',   em:'🦁', c1:'#e5303c', c2:'#ffd23f'},
  {name:'Mint Monsters', short:'Monsters',em:'👾', c1:'#22c98a', c2:'#6a2cff'},
  {name:'Pink Pandas',   short:'Pandas',  em:'🐼', c1:'#ff6fb5', c2:'#26203a'},
  {name:'Star Robots',   short:'Robots',  em:'🤖', c1:'#b9c6d8', c2:'#00c8ff'},
];
const GK_COL = ['#ffe14a', '#a86bff'];
const LEVELS = {
  easy:   {spd:.78, react:.36, acc:.6,  steal:1.0, slide:.2, gk:.52, shootR:240, power:.85},
  normal: {spd:.9,  react:.2,  acc:.34, steal:2.0, slide:.45,gk:.68, shootR:285, power:.95},
  hard:   {spd:1.0, react:.1,  acc:.16, steal:3.4, slide:.9, gk:.8,  shootR:330, power:1.05},
};
const HELPER_LV = {spd:.95, react:.15, acc:.3, steal:0, slide:0, gk:.72, shootR:290, power:1};
const ROLES = ['gk','def','lw','rw'];
const KO  = {gk:[22,CY], def:[W*.19,CY], lw:[W*.35,H*.27], rw:[W*.35,H*.73]};
const ATT = {gk:[22,CY], def:[W*.42,CY], lw:[W*.7,H*.2],  rw:[W*.7,H*.8]};
const DEF = {gk:[22,CY], def:[W*.14,CY], lw:[W*.3,H*.3],  rw:[W*.3,H*.7]};
const SKINS = ['#f6d2b0','#e8b48a','#c68a5c','#8d5a36','#5c3a22','#f1c8a0'];
const HAIRS = ['#2a1a10','#5a3418','#e8c060','#111','#a0401c','#3a2a20'];
const SAVE_KEY = 'goalRushSoccer';

/* ================= save ================= */
let save = {};
try { save = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch(e) {}
const S = {
  mode: save.mode === '2p' ? '2p' : 'cpu',
  t0: Number.isInteger(save.t0) ? save.t0 : 0,
  t1: Number.isInteger(save.t1) ? save.t1 : 2,
  level: LEVELS[save.level] ? save.level : 'normal',
  len: [1,2,3].includes(save.len) ? save.len : 2,
  sound: save.sound !== false,
  rec: Object.assign({w:0,d:0,l:0,gf:0,ga:0}, save.rec || {}),
};
if (S.t0 === S.t1) S.t1 = (S.t0 + 1) % TEAMS.length;
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {} }

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rand = (a=1,b) => b === undefined ? Math.random()*a : a + Math.random()*(b-a);
const hyp = Math.hypot;
const dist = (a,b) => hyp(a.x-b.x, a.y-b.y);
const tX = (team,x) => team === 0 ? x : W - x;
const tY = (team,y) => team === 0 ? y : H - y;

/* ================= sound ================= */
let actx = null, noiseBuf = null;
function ac(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  return actx;
}
function canSound(){ return S.sound && !(G && G.demo); }
function tone(f, dur, type='sine', vol=.15, f2=null, delay=0){
  if (!canSound()) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(dur, vol=.2, freq=1000, q=1, delay=0, attack=.005){
  if (!canSound()) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+attack); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t, rand(1)); s.stop(t+dur+.05);
}
const sfx = {
  kick(p=.5){ noise(.07, .25+.3*p, 900, 1.2); tone(110, .1, 'sine', .3*p+.15, 50); },
  pass(){ noise(.05, .2, 1300, 1.5); tone(160, .06, 'sine', .15, 90); },
  whistle(n=1, long=false){ for (let i=0;i<n;i++){ const d=i*.32, L = long && i===n-1 ? .7 : .22;
      tone(2750, L, 'sine', .09, null, d); tone(2900, L, 'triangle', .05, null, d); } },
  goal(){ noise(2.2, .28, 700, .6, 0, .25); noise(1.6, .12, 2400, .8, .1, .2); [523,659,784,1047].forEach((f,i)=>tone(f,.25,'square',.06,null,.05+i*.11)); },
  save(){ tone(330, .14, 'triangle', .2, 180); noise(.1, .2, 600); },
  tackle(){ noise(.16, .22, 450, .8); },
  swish(){ noise(.18, .12, 2200, .7, 0, .04); },
  click(){ tone(660, .06, 'triangle', .1); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'square',.07,null,i*.13)); noise(2,.2,800,.6,0,.3); },
  lose(){ [392,330,262].forEach((f,i)=>tone(f,.35,'triangle',.12,null,i*.22)); },
};

/* ================= canvas & layout ================= */
const cv = $('c'), ctx = cv.getContext('2d');
let DPR = 1, CW = 0, CH = 0;
const view = {s:1, ox:0, oy:0, rot:false};
const touch = { on: matchMedia('(pointer:coarse)').matches, L: [null,null] };
const HUDH = 56;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = innerWidth; CH = innerHeight;
  cv.width = Math.round(CW*DPR); cv.height = Math.round(CH*DPR);
  layout();
}
function layout(){
  const twoP = G && !G.demo && G.mode === '2p';
  view.rot = CW < CH && !twoP;
  const ctrlH = (view.rot && touch.on) ? Math.min(220, Math.max(160, CH*.24)) : 0;
  const availH = CH - HUDH - ctrlH - 6;
  if (view.rot) {
    view.s = Math.min((CW-8)/VH, availH/VW);
    view.ox = (CW - VH*view.s)/2;
    view.oy = HUDH + (ctrlH ? 0 : (availH - VW*view.s)/2);
  } else {
    view.s = Math.min((CW-8)/VW, availH/VH);
    view.ox = (CW - VW*view.s)/2;
    view.oy = HUDH + (availH - VH*view.s)/2;
  }
  // touch control layout
  const fieldBottom = view.rot ? view.oy + VW*view.s : view.oy + VH*view.s;
  const R = Math.max(34, Math.min(50, Math.min(CW,CH)*.11));
  if (twoP) {
    touch.L[0] = { zone:[0,HUDH,CW*.27,CH], home:{x:R*1.7, y:CH-R*1.9}, pass:{x:CW*.31, y:CH-R*1.1, r:R*.8}, shoot:{x:CW*.4, y:CH-R*1.6, r:R*.95}, col:'#ffd23f' };
    touch.L[1] = { zone:[CW*.73,HUDH,CW,CH], home:{x:CW-R*1.7, y:CH-R*1.9}, pass:{x:CW*.69, y:CH-R*1.1, r:R*.8}, shoot:{x:CW*.6, y:CH-R*1.6, r:R*.95}, col:'#5fe0ff' };
  } else if (view.rot) {
    const cy = Math.max(fieldBottom + (CH-fieldBottom)/2, CH - 110);
    touch.L[0] = { zone:[0,HUDH,CW*.5,CH], home:{x:CW*.24, y:cy}, pass:{x:CW-R*3.3, y:cy+R*.55, r:R*.85}, shoot:{x:CW-R*1.35, y:cy-R*.35, r:R*1.05}, col:'#ffd23f' };
    touch.L[1] = null;
  } else {
    touch.L[0] = { zone:[0,HUDH,CW*.45,CH], home:{x:Math.max(R*1.8, view.ox*.5), y:CH-R*2}, pass:{x:CW-R*3.4, y:CH-R*1.2, r:R*.85}, shoot:{x:CW-R*1.4, y:CH-R*2.1, r:R*1.05}, col:'#ffd23f' };
    touch.L[1] = null;
  }
  for (const s of sticks) if (s.id === null) { const L = touch.L[s.h]; if (L) { s.ox = L.home.x; s.oy = L.home.y; } }
}
function w2s(x, y){
  if (view.rot) return [view.ox + (y - VY0)*view.s, view.oy + (VX0 + VW - x)*view.s];
  return [view.ox + (x - VX0)*view.s, view.oy + (y - VY0)*view.s];
}
function setWorld(shx=0, shy=0){
  const s = view.s*DPR;
  if (view.rot) ctx.setTransform(0, -s, s, 0, (view.ox + shx - VY0*view.s)*DPR, (view.oy + shy + (VX0+VW)*view.s)*DPR);
  else ctx.setTransform(s, 0, 0, s, (view.ox + shx - VX0*view.s)*DPR, (view.oy + shy - VY0*view.s)*DPR);
}
function setScreen(){ ctx.setTransform(DPR,0,0,DPR,0,0); }

/* ================= input ================= */
const keys = {}, pressed = {};
const PREVENT = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space']);
addEventListener('keydown', e => {
  if (PREVENT.has(e.code) && G && !G.demo) e.preventDefault();
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
  if ((e.code === 'Escape' || e.code === 'KeyP') && G && !G.demo && G.state !== 'over') togglePause();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const KEYMAP = {
  solo: { up:['KeyW','ArrowUp'], down:['KeyS','ArrowDown'], left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'],
          pass:['KeyJ','KeyX','KeyF'], shoot:['KeyK','Space','KeyG','KeyC'] },
  p1:   { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], pass:['KeyF'], shoot:['KeyG'] },
  p2:   { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], pass:['KeyK','Numpad1'], shoot:['KeyL','Numpad2'] },
};
const anyKey = list => list.some(k => keys[k]);
const anyPressed = list => list.some(k => pressed[k]);

// touch sticks and buttons
const sticks = [{h:0,id:null,ox:0,oy:0,x:0,y:0}, {h:1,id:null,ox:0,oy:0,x:0,y:0}];
const tbtn = [{pass:{id:null,down:false,hit:false}, shoot:{id:null,down:false,hit:false}},
              {pass:{id:null,down:false,hit:false}, shoot:{id:null,down:false,hit:false}}];
function activeHumans(){ return G && !G.demo ? (G.mode === '2p' ? [0,1] : [0]) : []; }
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  if (!touch.on) { touch.on = true; layout(); }
  ac();
  const x = e.clientX, y = e.clientY;
  for (const h of activeHumans()) {
    const L = touch.L[h]; if (!L) continue;
    for (const b of ['shoot','pass']) {
      const B = L[b];

      if (dist(q, b) > PR+BR+4) continue;
      const T = G.teams[q.team];
      const human = T.human !== null && G.ctrl[q.team] === q;
      const rate = q.slideT > 0 ? 1e9 : human ? 5 : T.lv.steal;

        const slid = q.slideT > 0;
        take(q); o.stunT = slid ? .6 : .25; o.charging = false;
        sfx.tackle(); puff(b.x, b.y, slid ? 8 : 4, '#d8f5c8cc');
        return;
      }
    }
    return;
  }

function goalFor(t){

  sfx.goal();

function step(dt){
  if (!G) return;
  G.clock += dt;
  G.shake = Math.max(0, G.shake - dt*20);
  G.crowdJump = Math.max(0, G.crowdJump - dt);
  if (G.state === 'kickoff') {
    G.stateT -= dt;
    if (G.stateT <= 0) { G.state = 'play'; sfx.whistle(1); if (!G.demo && !G.golden) banner('GO!'); }
  } else if (G.state === 'play') {
    updatePlay(dt);

    const c = G.conf[i]; c.life -= dt; c.y += c.vy*dt; c.x += c.vx*dt + Math.sin(c.y*.03)*.6; c.r += c.vr*dt;
    if (c.life <= 0 || c.y > CH + 20) { G.conf.splice(i,1); continue; }
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h); ctx.restore();
  }
}

/* ================= HUD / UI ================= */
const hud = $('hud');
let lastHud = '';
function updateHud(force, bumpTeam){
  if (!G || G.demo) return;
  const [a, c] = G.teams;
  const tl = Math.max(0, Math.ceil(G.time));
  const clock = (G.golden ? '⭐ ' : '') + Math.floor(tl/60) + ':' + String(tl%60).padStart(2,'0');
  const key = a.score + '|' + c.score + '|' + clock;
  if (!force && key === lastHud) return;
  lastHud = key;
  $('hudScore').textContent = `${a.score} - ${c.score}`;
  $('hudClock').textContent = clock;
  $('hudClock').classList.toggle('gold', G.golden);
  if (force) {
    for (const [id, T] of [['hudT0', a], ['hudT1', c]]) {
      const el = $(id);
      el.querySelector('.em').textContent = T.em;
      el.querySelector('.nm').textContent = CW < 420 ? '' : T.short;
      el.querySelector('.chip').style.background = T.c1;
    }
  }
  if (bumpTeam !== undefined) { const el = $('hudScore'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
let bannerTimer = 0;
function banner(text, small=''){
  const el = $('banner');
  el.innerHTML = '';
  el.append(document.createTextNode(text));
  if (small) { const s = document.createElement('small'); s.textContent = small; el.append(s); }
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function show(id, on){ $(id).classList.toggle('hide', !on); }
function inGameUi(on){ show('hud', on); show('pauseBtn', on); show('soundBtn', on); }
let paused = false;
function togglePause(force){
  if (!G || G.demo) return;
  paused = force !== undefined ? force : !paused;
  show('pause', paused);
  if (paused) for (const st of sticks) st.id = null;
}
function startDemo(){
  let a = (Math.random()*TEAMS.length)|0, c = (a + 1 + ((Math.random()*(TEAMS.length-1))|0)) % TEAMS.length;
  newMatch({demo:true, t0:a, t1:c, mode:'cpu', level:'normal', len:3});
}
function startGame(){
  ac(); sfx.click();
  show('menu', false); show('result', false); togglePause(false);
  newMatch({t0:S.t0, t1:S.t1, mode:S.mode, level:S.level, len:S.len});
  inGameUi(true);
  layout();
}
function toMenu(){
  show('result', false); togglePause(false); inGameUi(false);
  buildMenu(); show('menu', true);
  startDemo();
}
function showResult(){
  const [a, c] = G.teams, sa = a.score, sc = c.score;
  let em, title;
  if (G.mode === 'cpu') {
    if (sa > sc) { em = '🏆'; title = 'YOU WIN!'; sfx.win(); confetti([a.c1, a.c2, '#ffd23f', '#7be36b'], 220); }
    else if (sa === sc) { em = '🤝'; title = "It's a draw!"; sfx.click(); }
    else { em = '😅'; title = 'Good try!'; sfx.lose(); }
  } else {
    if (sa === sc) { em = '🤝'; title = "It's a draw!"; }
    else { const w = sa > sc ? a : c; em = '🏆'; title = `${w.short} win!`; sfx.win(); confetti([w.c1, w.c2, '#ffd23f'], 220); }
  }
  $('resEm').textContent = em; $('resTitle').textContent = title;
  $('resScore').innerHTML = '';
  const sp = (t) => { const s = document.createElement('span'); s.textContent = t; return s; };
  const b1 = document.createElement('b'); b1.textContent = `${sa} - ${sc}`;
  $('resScore').append(sp(`${a.em} ${a.short}`), b1, sp(`${c.short} ${c.em}`));
  const r = S.rec;
  $('resRec').textContent = G.mode === 'cpu' ? `Your record: ${r.w} wins · ${r.d} draws · ${r.l} losses` : 'Rematch? Swap teams in the menu!';
  show('result', true);
}

function segInit(id, get, set){
  const el = $(id);
  el.querySelectorAll('button').forEach(b => {
    b.onclick = () => { set(b.dataset.v); sfx.click(); persist(); buildMenu(); };
  });
}
function buildMenu(){
  const sel = (id, v) => $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  sel('modeSeg', S.mode); sel('levelSeg', S.level); sel('lenSeg', S.len);
  show('levelWrap', S.mode === 'cpu');
  $('lbl0').textContent = S.mode === '2p' ? 'Player 1 team' : 'Your team';
  $('lbl1').textContent = S.mode === '2p' ? 'Player 2 team' : 'Computer team';
  for (const k of [0,1]) {
    const box = $('pick'+k); box.innerHTML = '';
    TEAMS.forEach((T, i) => {
      const b = document.createElement('button');
      const em = document.createElement('span'); em.className = 'em'; em.textContent = T.em;
      const nm = document.createElement('span'); nm.textContent = T.name;
      const kit = document.createElement('span'); kit.className = 'kit';
      const k1 = document.createElement('i'); k1.style.background = T.c1; const k2 = document.createElement('i'); k2.style.background = T.c2;
      kit.append(k1, k2); b.append(em, nm, kit);
      const mine = k ? S.t1 : S.t0, other = k ? S.t0 : S.t1;
      if (i === mine) b.classList.add('on');
      if (i === other) b.disabled = true;
      b.onclick = () => { if (k) S.t1 = i; else S.t0 = i; sfx.click(); persist(); buildMenu(); };
      box.append(b);
    });
  }
  const r = S.rec;
  $('recLine').textContent = (r.w + r.d + r.l) ? `Your record vs the computer: ${r.w} wins · ${r.d} draws · ${r.l} losses` : '';
  $('menuSound').textContent = S.sound ? '🔊 Sound on' : '🔇 Sound off';
  $('soundBtn').textContent = S.sound ? '🔊' : '🔇';
  const help = helpHtml();
  $('helpBox').innerHTML = help; $('helpBox2').innerHTML = help;
}
function helpHtml(){
  const t = touch.on ? '<b>Phone/tablet:</b> drag the left side to run. <b>SHOOT</b> (hold for a harder shot) and <b>PASS</b>. Without the ball, the buttons become <b>TACKLE</b> and <b>SWITCH</b> player.<br>' : '';
  const k = S.mode === '2p'
    ? '<b>Player 1:</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> run, <kbd>F</kbd> pass/switch, <kbd>G</kbd> shoot/tackle<br><b>Player 2:</b> arrow keys run, <kbd>K</kbd> pass/switch, <kbd>L</kbd> shoot/tackle'
    : '<b>Keyboard:</b> arrows or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> run, <kbd>Space</kbd> or <kbd>K</kbd> shoot (hold for power), <kbd>J</kbd> or <kbd>X</kbd> pass. Without the ball: shoot key = slide tackle, pass key = switch player.';
  return t + k + '<br><kbd>P</kbd> or <kbd>Esc</kbd> pauses.';
}
segInit('modeSeg', null, v => { S.mode = v; });
segInit('levelSeg', null, v => { S.level = v; });
segInit('lenSeg', null, v => { S.len = Number(v); });
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('menuBtn').onclick = () => { sfx.click(); toMenu(); };
$('resumeBtn').onclick = () => { sfx.click(); togglePause(false); };
$('restartBtn').onclick = startGame;
$('quitBtn').onclick = () => { sfx.click(); toMenu(); };
$('pauseBtn').onclick = () => togglePause(true);
const flipSound = () => { S.sound = !S.sound; persist(); buildMenu(); if (S.sound) { ac(); sfx.click(); } };
$('menuSound').onclick = flipSound; $('soundBtn').onclick = flipSound;
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.demo && G.state !== 'over') togglePause(true); });

/* ================= loop ================= */
let last = performance.now(), acc = 0;
const STEP = 1/60;
function frame(now){
  let dt = Math.min(.1, (now - last)/1000); last = now;
  if (!paused) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
  }
  render(paused ? 0 : dt);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
buildMenu();
startDemo();
requestAnimationFrame(frame);

/* test hooks */
window.GR = {
  get G(){ return G; }, S, step, sticks, touch, readInput: h => readInput(h), startGame, toMenu, startDemo,
  sim(seconds){ const n = Math.round(seconds*60); for (let i=0;i<n;i++) step(STEP); return G && [G.teams[0].score, G.teams[1].score]; },
  goal(t){ if (G) goalFor(t); }, end(){ if (G) { G.time = 0; } },
};
})();
</script>
