<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rise to the Rim</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1e;overflow:hidden;font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas#c{display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:none}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,24,.7);z-index:5;padding:12px;overflow:auto}
  #ov.hidden{display:none}
  .card{background:#fffaf2;color:#1d2240;border-radius:18px;max-width:600px;width:100%;padding:20px 24px;box-shadow:0 18px 50px rgba(0,0,0,.55);text-align:center;max-height:94vh;overflow:auto;box-sizing:border-box}
  .card.wide{max-width:760px}
  .card h1{margin:4px 0 6px;font-size:34px;color:#e8590c}
  .card h2{margin:4px 0 8px;font-size:24px}
  .card p{line-height:1.45;margin:8px 0}
  .card .small{font-size:13px;opacity:.75}
  .card button{font:inherit;font-weight:bold;font-size:16px;border:0;border-radius:12px;padding:10px 16px;margin:5px;cursor:pointer;background:#e8590c;color:#fff;box-shadow:0 4px 0 #a33d06}
  .card button:active{transform:translateY(2px);box-shadow:0 2px 0 #a33d06}
  .card button.alt{background:#3b4a8a;box-shadow:0 4px 0 #222c5c}
  .card button.ok{background:#2b8a3e;box-shadow:0 4px 0 #1a5a26}
  .card button:disabled{opacity:.45;cursor:default}
  .card input[type=text]{font:inherit;font-size:18px;padding:8px 12px;border-radius:10px;border:2px solid #c9cde0;width:220px;text-align:center}
  .opts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 10px}
  .opt{border:3px solid transparent;border-radius:12px;padding:6px 10px;cursor:pointer;background:#eef0f8;font-weight:bold;font-size:14px}
  .opt.sel{border-color:#e8590c;background:#fff0e4}
  .sw{width:34px;height:34px;padding:0;border-radius:50%}
  .lbl{font-weight:bold;font-size:14px;margin-top:8px;color:#5a5f80;text-transform:uppercase;letter-spacing:1px}
  .hubtop{display:flex;gap:16px;align-items:center;text-align:left;flex-wrap:wrap;justify-content:center}
  .ovr{display:inline-block;background:#1d2240;color:#ffd23f;border-radius:12px;padding:6px 12px;font-size:28px;font-weight:900;margin:4px 0}
  .bar{height:12px;background:#e2e5f2;border-radius:99px;overflow:hidden;margin:4px 0}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#e8590c);border-radius:99px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;margin:12px 0}
  .stat{font-size:14px}
  .stat b{float:right}
  .stat .bar{height:9px}
  .info{background:#eef0f8;border-radius:12px;padding:8px 12px;margin:10px 0;font-size:15px}
  table{border-collapse:collapse;margin:8px auto;font-size:14px}
  td,th{padding:4px 10px;border-bottom:1px solid #e2e5f2}
  tr.me td{background:#fff0e4;font-weight:bold}
  .up{display:flex;align-items:center;gap:10px;text-align:left;margin:6px 0}
  .up .n{flex:1}
  .up button{padding:6px 14px;margin:0}
  .big{font-size:44px}
  #back{position:fixed;left:12px;top:10px;z-index:6;color:#fff;text-decoration:none;font-weight:bold;background:rgba(0,0,0,.4);padding:6px 12px;border-radius:10px;font-size:14px}
  #mute{position:fixed;right:12px;top:10px;z-index:6;background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:16px;cursor:pointer}
  #touch{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
  #touch.on{display:block}
  #stick{position:absolute;left:24px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
  .tb{position:absolute;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-size:15px}
  #tShoot{right:24px;bottom:40px;width:96px;height:96px;background:rgba(232,89,12,.55)}
  #tPass{right:132px;bottom:24px;width:72px;height:72px}
  #tSprint{right:110px;bottom:110px;width:62px;height:62px;font-size:12px}
  #arrows{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:10px;pointer-events:auto}
  #arrows.on{display:flex}
  #arrows div{width:70px;height:70px;border-radius:14px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:34px;touch-action:none}
</style>
</head>
<body>
<a id="back" href="/">⬅ All games</a>
<button id="mute" title="Sound on/off">🔊</button>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="tb" id="tShoot">SHOOT</div><div class="tb" id="tPass">PASS</div><div class="tb" id="tSprint">SPRINT</div>
  <div id="arrows"><div data-k="arrowleft">⬅</div><div data-k="arrowup">⬆</div><div data-k="arrowdown">⬇</div><div data-k="arrowright">➡</div></div>
</div>
<div id="ov" class="hidden"></div>
<script>
'use strict';
// ====================================================================== setup
const W = 960, H = 540;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov');
function fit(){ const s = Math.min(innerWidth/W, innerHeight/H); cv.style.width = (W*s) + 'px'; cv.style.height = (H*s) + 'px'; }
addEventListener('resize', fit); fit();
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const rnd = (a, b) => a + Math.random()*(b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = a => a[Math.floor(Math.random()*a.length)];

// ====================================================================== sound (all synthesized)
let AC = null, muted = false;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'sine', v = 0.1, slide = 0, delay = 0){
  if (!AC || muted) return; const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f*slide), t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
function noise(d, v = 0.1, freq = 1000, q = 1, type = 'bandpass'){
  if (!AC || muted) return; const n = AC.createBuffer(1, Math.floor(AC.sampleRate*d), AC.sampleRate), data = n.getChannelData(0);
  for (let i=0;i<data.length;i++) data[i] = (Math.random()*2 - 1)*Math.sin(Math.PI*i/data.length);
  const s = AC.createBufferSource(); s.buffer = n; const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.value = v; s.connect(f).connect(g).connect(AC.destination); s.start();
}
const sfx = {
  dribble(v = 0.16){ tone(95, 0.08, 'sine', v, 0.55); },
  swish(){ noise(0.32, 0.16, 2600, 0.7, 'highpass'); },
  rim(){ tone(480, 0.16, 'square', 0.045, 0.75); tone(760, 0.12, 'triangle', 0.05); },
  buzzer(){ tone(196, 0.9, 'sawtooth', 0.07); tone(199, 0.9, 'square', 0.035); },
  whistle(){ tone(2300, 0.28, 'sine', 0.07, 1.03); },
  cheer(){ noise(1.5, 0.1, 1100, 0.4); noise(1.2, 0.05, 2500, 0.6); },
  click(){ tone(660, 0.05, 'triangle', 0.06); },
  pass(){ tone(320, 0.06, 'triangle', 0.07, 1.4); },
  up(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, 'triangle', 0.08, 0, i*0.09)); },
  steal(){ tone(300, 0.12, 'square', 0.06, 2.2); },
  bad(){ tone(180, 0.28, 'sawtooth', 0.06, 0.7); },
  fanfare(){ [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.09, 0, i*0.13)); },
};
document.getElementById('mute').onclick = e => { e.stopPropagation(); muted = !muted; e.target.textContent = muted ? '🔇' : '🔊'; };

// ====================================================================== career data
const STATS = [['sht','Shooting','🎯'],['thr','3-Pointers','🏹'],['drb','Dribbling','⛹️'],['spd','Speed','⚡'],['def','Defense','🛡️'],['reb','Jumping','🦘']];
const POS = {
  Guard:   { desc:'Fast, great dribbler and 3-point shooter', b:{ sht:2, thr:8, drb:8, spd:6, def:-4, reb:-10 } },
  Forward: { desc:'Good at everything, a strong scorer',      b:{ sht:6, thr:0, drb:0, spd:0, def:2, reb:2 } },
  Center:  { desc:'Big and strong, owns the rebounds and blocks', b:{ sht:2, thr:-10, drb:-6, spd:-6, def:8, reb:12 } },
};
const RANKS = [[0,'Rookie','🥉'],[55,'Rotation Player','🏀'],[65,'Starter','⭐'],[75,'All-Star','🌟'],[85,'Superstar','💫'],[93,'MVP','🏆'],[99,'Legend','👑']];
const LEAGUE = [
  { name:'Maple Moose', c:'#8b2a2a', d:'#5a1414', off:-6 },
  { name:'Lakeshore Lynx', c:'#2a6b8b', d:'#14425a', off:-3 },
  { name:'Thunder Turtles', c:'#3a8b2a', d:'#1f5a14', off:0 },
  { name:'Comet Coyotes', c:'#8b6a2a', d:'#5a4314', off:2 },
  { name:'Blizzard Bears', c:'#5a7ab0', d:'#33497a', off:4 },
  { name:'Iron Owls', c:'#55555f', d:'#2e2e36', off:6 },
  { name:'Northern Lights', c:'#6a2a8b', d:'#40145a', off:8 },
];
const COLORS = [['#e8590c','#9c3a05'],['#1c7ed6','#0f4c88'],['#2b8a3e','#195a26'],['#c2255c','#7f1239'],['#f2b705','#a57c00'],['#212529','#000000'],['#7048e8','#43289a'],['#0ca678','#066b4c']];
const SKINS = ['#f6d3b3','#e8b48a','#c68a5e','#9a6440','#6b4426','#4a2e1a'];
const HAIRS = ['#1a1209','#4a2a12','#8a5a2a','#d9a441','#b5402a','#e8e8e8'];
const STYLES = ['short','puff','headband'];
const FIRST = ['Jay','Mika','Theo','Zara','Kofi','Liam','Ravi','Nia','Owen','Sami','Dante','Leo','Ari','Jonah','Kai','Malik','Eli','Rosa','Tariq','Ben','Isa','Max','Noor','Cole','Dev','Luca'];
const LAST = ['Brooks','Carter','Singh','Okafor','Reyes','Lam','Patel','Moreau','Hughes','Diallo','Kim','Novak','Silva','Grant','Young','Price','Ward','Mensah','Lopez','Fraser'];
const QLENS = { Short:40, Normal:70, Long:110 };
const STORE = 'riseToTheRim';
let C = null; // the career
function saveCareer(){ try { localStorage.setItem(STORE, JSON.stringify(C)); } catch(e){} }
function loadCareer(){ try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.stats) C = s; } catch(e){} }
const ovr = (st = C.stats) => Math.round(STATS.reduce((a, [k]) => a + st[k], 0)/STATS.length);
const rankOf = o => { let r = RANKS[0]; for (const x of RANKS) if (o >= x[0]) r = x; return r; };
const nextRank = o => RANKS.find(x => x[0] > o);
const mateRating = () => clamp(Math.round(42 + (ovr() - 42)*0.8), 40, 94);
const teamAvg = () => Math.round((ovr() + 2*mateRating())/3);
function randLook(){ return { skin:pick(SKINS), hair:pick(HAIRS), style:pick(STYLES) }; }
function randName(){ return pick(FIRST) + ' ' + pick(LAST); }
function newCareer(o){
  const stats = {}; for (const [k] of STATS) stats[k] = clamp(42 + POS[o.pos].b[k], 30, 60);
  const others = Object.keys(POS).filter(p => p !== o.pos);
  const mates = others.map((p, i) => ({ name:randName(), num:[3, 7, 11, 21, 33][Math.floor(Math.random()*5)] + i, pos:p, look:randLook() }));
  const standings = {}; for (const t of LEAGUE) standings[t.name] = [0, 0]; standings[o.team] = [0, 0];
  C = { name:o.name, num:o.num, pos:o.pos, look:o.look, color:o.color, team:o.team, stats, sp:0, energy:2, games:0, wins:0, losses:0,
        season:1, round:0, standings, champs:0, maxed:false, mates, qlen:'Normal', totals:{ pts:0, reb:0, ast:0, stl:0, blk:0 }, best:0, lastRank:rankOf(ovr(stats))[1] };
  saveCareer();
}
function opponentFor(){
  if (C.round >= LEAGUE.length){ // finals vs best record
    const best = LEAGUE.slice().sort((a, b) => (C.standings[b.name][0] - C.standings[b.name][1]) - (C.standings[a.name][0] - C.standings[a.name][1]))[0];
    return { team:best, rating:clamp(teamAvg() + 9, 38, 98), finals:true };
  }
  const t = LEAGUE[C.round]; return { team:t, rating:clamp(teamAvg() + t.off, 35, 97), finals:false };
}

// ====================================================================== input
const keys = {}, pressed = {}, released = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  audio(); if (!keys[k]) pressed[k] = true; keys[k] = true;
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys[k] = false; released[k] = true; });
const touch = { dx:0, dy:0, shoot:false, sprint:false };
const tEl = document.getElementById('touch'), stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null;
function stickMove(e){ const r = stick.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const m = Math.hypot(dx, dy), mx = r.width/2 - 10; if (m > mx){ dx *= mx/m; dy *= mx/m; }
  touch.dx = Math.abs(dx) > 10 ? dx/mx : 0; touch.dy = Math.abs(dy) > 10 ? dy/mx : 0; knob.style.transform = `translate(${dx}px,${dy}px)`; }
stick.addEventListener('pointerdown', e => { audio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
const stickEnd = e => { if (e.pointerId !== stickId) return; stickId = null; touch.dx = touch.dy = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
function holdBtn(id, k){ const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); audio(); el.setPointerCapture(e.pointerId); if (!keys[k]) pressed[k] = true; keys[k] = true; });
  const up = () => { if (keys[k]){ keys[k] = false; released[k] = true; } }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); }
holdBtn('tShoot', ' '); holdBtn('tPass', 'e'); holdBtn('tSprint', 'shift');
document.querySelectorAll('#arrows div').forEach(el => el.addEventListener('pointerdown', e => { e.preventDefault(); audio(); pressed[el.dataset.k] = true; }));
cv.addEventListener('pointerdown', () => { audio(); if (state === 'drill' && D && D.kind !== 'dribble') pressed[' '] = true; });
function moveInput(){
  let dx = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0), dy = (keys.arrowdown || keys.s ? 1 : 0) - (keys.arrowup || keys.w ? 1 : 0);
  if (touch.dx || touch.dy){ dx = touch.dx; dy = touch.dy; }
  const m = Math.hypot(dx, dy); return m > 1 ? [dx/m, dy/m] : [dx, dy];
}
function showTouch(on, arrows){ tEl.classList.toggle('on', on && isTouch); document.getElementById('arrows').classList.toggle('on', !!arrows);
  for (const id of ['stick', 'tShoot', 'tPass', 'tSprint']) document.getElementById(id).style.display = arrows ? 'none' : ''; }

// ====================================================================== drawing helpers
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function circ(c, x, y, r){ c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill(); }
function ell(c, x, y, rx, ry){ c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); c.fill(); }
function drawBall(c, x, y, r = 6){
  c.fillStyle = '#e8701a'; circ(c, x, y, r); c.strokeStyle = '#5a2a08'; c.lineWidth = 1;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.moveTo(x - r, y); c.lineTo(x + r, y); c.moveTo(x, y - r); c.lineTo(x, y + r); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.35)'; circ(c, x - r*0.35, y - r*0.35, r*0.3);
}
// an original cartoon baller, drawn from a 3/4 view
function drawPerson(c, x, y, s, look, kit, num, dir, t, moving, jump = 0, arms = 0){
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(0,0,0,.28)'; ell(c, 0, 0, 14 - jump*0.08, 5);
  c.translate(0, -jump);
  const st = moving ? Math.sin(t*13)*3.5 : 0;
  c.fillStyle = look.skin; c.fillRect(-7, -15, 5, 12 + st); c.fillRect(2, -15, 5, 12 - st);
  c.fillStyle = '#fff'; c.fillRect(-8, -4 + st, 7, 4); c.fillRect(1, -4 - st, 7, 4);
  c.fillStyle = kit[0]; c.fillRect(-8, -5 + st, 7, 1.5); c.fillRect(1, -5 - st, 7, 1.5);
  c.fillStyle = kit[1]; rr(c, -10, -22, 20, 10, 3); c.fill();
  c.fillStyle = kit[0]; rr(c, -10, -40, 20, 21, 5); c.fill();
  c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(-10, -40, 20, 2);
  // arms (arms = 1 means reaching up to shoot or block)
  c.fillStyle = look.skin;
  if (arms){ c.fillRect(-13, -56, 4, 18); c.fillRect(9, -56, 4, 18); }
  else { c.save(); c.translate(-12, -37); c.rotate(moving ? -st*0.05 : 0.1); c.fillRect(-2, 0, 4, 14); c.restore(); c.save(); c.translate(12, -37); c.rotate(moving ? st*0.05 : -0.1); c.fillRect(-2, 0, 4, 14); c.restore(); }
  c.fillStyle = '#fff'; c.font = 'bold 10px Verdana, sans-serif'; c.textAlign = 'center'; c.fillText(String(num), 0, -26); c.textAlign = 'left';
  c.fillStyle = look.skin; c.fillRect(-3, -45, 6, 5); circ(c, 0, -50, 8.5);
  c.fillStyle = look.hair;
  if (look.style === 'puff'){ circ(c, 0, -56, 9); circ(c, -6, -53, 6); circ(c, 6, -53, 6); }
  else { c.beginPath(); c.arc(0, -51, 9, Math.PI, 0); c.fill(); }
  if (look.style === 'headband'){ c.fillStyle = kit[0]; c.fillRect(-9, -54, 18, 3.5); }
  c.fillStyle = '#1a1209'; circ(c, dir*2.5 - 2.5, -50, 1.3); circ(c, dir*2.5 + 2.5, -50, 1.3);
  c.restore();
}
function drawAvatar(canvas){
  const c = canvas.getContext('2d'); c.clearRect(0, 0, canvas.width, canvas.height);
  const g = c.createRadialGradient(70, 90, 10, 70, 90, 90); g.addColorStop(0, '#ffe6c8'); g.addColorStop(1, '#f6c08a'); c.fillStyle = g; c.fillRect(0, 0, canvas.width, canvas.height);
  drawPerson(c, 70, 158, 2.2, C.look, C.color, C.num, 1, 0, false);
  drawBall(c, 108, 128, 12);
}

// ====================================================================== court geometry
const CX0 = 40, CX1 = 920, CY0 = 84, CY1 = 504, CY = 294;
const HOOP = [{ x:92, y:CY }, { x:868, y:CY }];
const attackHoop = t => t === 0 ? HOOP[1] : HOOP[0];
const THREE = 200;
let courtCache = null;
function drawCourt(homeColor){
  if (!courtCache || courtCache.col !== homeColor[0]){
    const oc = document.createElement('canvas'); oc.width = W; oc.height = H; const c = oc.getContext('2d');
    // arena + crowd
    c.fillStyle = '#141a33'; c.fillRect(0, 0, W, H);
    for (let i=0;i<520;i++){ const x = (i*37.3) % W, top = i % 2 === 0, y = top ? 6 + ((i*13) % 66) : CY1 + 10 + ((i*7) % 28);
      if (!top && y > H - 4) continue; c.fillStyle = ['#e8590c','#f2b705','#1c7ed6','#c2255c','#eee','#2b8a3e','#7048e8'][i % 7]; circ(c, x, y, 3.2); c.fillStyle = '#f0c8a0'; circ(c, x, y - 4, 2.2); }
    // floor

    for (let i=0;i+1<others.length;i+=2){ const [a, c] = [others[i], others[i+1]], aw = Math.random() < 0.5 + (a.off - c.off)/40; s[a.name][aw ? 0 : 1]++; s[c.name][aw ? 1 : 0]++; }

let D = null;
function startDrill(kind){

  if (isTouch){ for (const id of ['stick', 'tPass', 'tSprint']) document.getElementById(id).style.display = 'none'; document.getElementById('tShoot').style.display = kind === 'dribble' ? 'none' : ''; document.getElementById('tShoot').textContent = kind === 'shoot' ? 'SHOOT' : 'STEAL'; }
}
function nextPrompt(){ D.prompt = { k:pick(['arrowleft', 'arrowright', 'arrowup', 'arrowdown']), t:0, win:Math.max(0.55, 1.4 - D.n*0.045) }; }
function drillReward(){ const s = D.score, tot = D.total; return s >= tot*0.8 ? 3 : s >= tot*0.55 ? 2 : s >= tot*0.25 ? 1 : 0; }
function updateDrill(dt){
  D.t += dt; for (const f of D.fx) f.t += dt; D.fx = D.fx.filter(f => f.t < 1);
  if (D.phase === 'done') return;
  if (D.kind === 'shoot'){
    const sw = 1.1 + D.n*0.06; D.needle += D.nd*dt*sw; if (D.needle > 1){ D.needle = 1; D.nd = -1; } if (D.needle < 0){ D.needle = 0; D.nd = 1; }
    if (D.ball){ D.ball.t += dt; if (D.ball.t > 0.8){ if (D.ball.made){ D.score++; sfx.swish(); } else sfx.rim(); D.ball = null; D.n++; if (D.n >= D.total) endDrill(); } }
    else if (pressed[' ']){ const gw = 0.06 + C.stats.sht/1600, d = Math.abs(D.needle - 0.5); const made = d < gw ? true : d < gw*2.2 ? Math.random() < 0.4 : false;
      D.ball = { t:0, made }; D.fx.push({ txt:made ? (d < gw ? 'PERFECT!' : 'Lucky!') : 'Miss', t:0, good:made }); }
  } else if (D.kind === 'dribble'){
    const p = D.prompt; p.t += dt;
    const hit = ['arrowleft', 'arrowright', 'arrowup', 'arrowdown'].find(k => pressed[k] || pressed[{ arrowleft:'a', arrowright:'d', arrowup:'w', arrowdown:'s' }[k]]);
    if (hit || p.t > p.win){
      const ok = hit === p.k; if (ok){ D.score++; sfx.dribble(0.2); } else sfx.bad();
      D.fx.push({ txt:ok ? pick(['Nice!', 'Smooth!', 'Crossover!', 'Quick hands!']) : p.t > p.win ? 'Too slow' : 'Wrong way', t:0, good:ok });
      D.n++; if (D.n >= D.total) endDrill(); else nextPrompt();
    }
  } else if (D.kind === 'defense'){
    if (D.glow > 0){ D.glow -= dt; if (D.glow <= 0){ D.fx.push({ txt:'Too slow', t:0, good:false }); D.n++; D.wait = rnd(0.7, 1.8); if (D.n >= D.total) endDrill(); } }
    else { D.wait -= dt; if (D.wait <= 0) D.glow = Math.max(0.32, 0.7 - D.n*0.035) - C.stats.def/1000*0; }
    if (pressed[' ']){
      if (D.glow > 0){ D.score++; D.glow = 0; sfx.steal(); D.fx.push({ txt:'STEAL!', t:0, good:true }); D.n++; D.wait = rnd(0.7, 1.8); if (D.n >= D.total) endDrill(); }
      else { sfx.bad(); D.fx.push({ txt:'Reached too early!', t:0, good:false }); D.wait = rnd(0.6, 1.3); }

}

    <div class="lbl">Team colour</div><div class="opts">${COLORS.map((c, i) => `<div class="opt sw${draft.color === i ? ' sel' : ''}" data-k="color" data-v="${i}" style="background:${c[0]}"></div>`).join('')}</div>
    <div class="lbl">Skin</div><div class="opts">${SKINS.map((c, i) => `<div class="opt sw${draft.skin === i ? ' sel' : ''}" data-k="skin" data-v="${i}" style="background:${c}"></div>`).join('')}</div>
    <div class="lbl">Hair</div><div class="opts">${HAIRS.map((c, i) => `<div class="opt sw${draft.hair === i ? ' sel' : ''}" data-k="hair" data-v="${i}" style="background:${c}"></div>`).join('')}
      ${STYLES.map((s, i) => `<div class="opt${draft.style === i ? ' sel' : ''}" data-k="style" data-v="${i}">${s}</div>`).join('')}</div>
    <div class="lbl">Team name</div><input type="text" id="iTeam" maxlength="18" value="${esc(draft.team)}">
    <div><canvas id="av" width="140" height="170" style="border-radius:14px;margin-top:10px"></canvas></div>
    <button id="bMake" class="ok">Start my career ▶</button><button id="bBack" class="alt">Back</button>`);
  const preview = () => { const save = C; C = { look:{ skin:SKINS[draft.skin], hair:HAIRS[draft.hair], style:STYLES[draft.style] }, color:COLORS[draft.color], num:draft.num }; drawAvatar(document.getElementById('av')); C = save; };
  preview();
  ov.querySelectorAll('.opt').forEach(el => el.onclick = () => { draft.name = document.getElementById('iName').value; draft.team = document.getElementById('iTeam').value;
    const k = el.dataset.k; draft[k] = k === 'pos' ? el.dataset.v : +el.dataset.v; sfx.click(); create(); });
  bind('bBack', title);
  bind('bMake', () => {
    const name = document.getElementById('iName').value.trim() || 'Rookie', tm = document.getElementById('iTeam').value.trim() || 'Oakville Acorns';
    newCareer({ name, pos:draft.pos, num:draft.num, color:COLORS[draft.color], look:{ skin:SKINS[draft.skin], hair:HAIRS[draft.hair], style:STYLES[draft.style] }, team:tm });
    hub();
  });
}
function checkRankUp(){
  const o = ovr(), r = rankOf(o);
  if (o >= 99 && !C.maxed){ C.maxed = true; C.lastRank = r[1]; saveCareer(); sfx.fanfare();
    showOv(`<h1>👑 MAX RANKING! 👑</h1><p class="big">🏀🔥</p><h2>${esc(C.name)} is a LEGEND!</h2>
      <p>You trained from a rookie all the way to <b>99 overall</b>, the highest ranking in the game.</p>
      <p>Now the real fun starts: <b>just play games with your team</b>, dominate the league and win as many championships as you can!</p>
      <button id="bHub" class="ok">Let's play! ▶</button>`); bind('bHub', hub); return true; }
  if (r[1] !== C.lastRank && RANKS.findIndex(x => x[1] === r[1]) > RANKS.findIndex(x => x[1] === C.lastRank)){
    C.lastRank = r[1]; saveCareer(); sfx.up();
    showOv(`<h1>RANK UP!</h1><p class="big">${r[2]}</p><h2>You are now: ${r[1]}</h2><p>Keep improving to reach the next ranking!</p><button id="bHub" class="ok">Awesome ▶</button>`); bind('bHub', hub); return true; }
  return false;
}
function hub(){
  state = 'hub'; showTouch(false); M = null;
  if (checkRankUp()) return;
  const o = ovr(), r = rankOf(o), nr = nextRank(o), opp = opponentFor();
  const lo = r[0], hi = nr ? nr[0] : 99, pct = nr ? Math.round((o - lo)/(hi - lo)*100) : 100;
  const rec = C.standings[C.team];
  showOv(`<div class="hubtop">
      <canvas id="av" width="140" height="170" style="border-radius:14px"></canvas>
      <div style="min-width:260px;flex:1">
        <h2 style="margin:0">${esc(C.name)} <span style="opacity:.6">#${C.num}</span></h2>
        <div>${C.pos} · ${esc(C.team)}</div>
        <div class="ovr">${o} OVR</div>
        <div><b>Rank: ${r[2]} ${r[1]}</b></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="small">${nr ? `Next rank: ${nr[2]} ${nr[1]} at ${nr[0]} OVR` : '👑 MAX RANKING reached! Legend Mode'}</div>
      </div></div>
    <div class="stats">${STATS.map(([k, n, e]) => `<div class="stat">${e} ${n} <b>${C.stats[k]}</b><div class="bar"><i style="width:${C.stats[k]}%"></i></div></div>`).join('')}</div>
    <div class="info">Season ${C.season} · ${opp.finals ? '<b>🏆 THE FINALS</b>' : `Game ${C.round + 1} of ${LEAGUE.length}`} · Record ${rec[0]}–${rec[1]} · 🏆 Titles: ${C.champs}
      <br>Next game: <b>vs ${opp.team.name}</b> (team rating ${opp.rating}) · Your team: ${teamAvg()}</div>
    ${C.maxed ? '<div class="info" style="background:#fff3c4">👑 <b>Legend Mode.</b> You reached the max ranking. Now just play games with your team and collect championships!</div>' : ''}
    <button id="bPlay">🏀 Play ${opp.finals ? 'THE FINALS' : 'next game'}</button>
    ${C.maxed ? '' : `<button id="bUp" class="ok">⬆ Upgrade (${C.sp} pts)</button>`}
    <button id="bTrain" class="alt">💪 Training (${C.energy}/2)</button>
    <button id="bTable" class="alt">📊 Standings</button>
    <button id="bSet" class="alt">⚙️</button>
    <p class="small">Career: ${C.games} games · ${C.wins} wins · ${C.totals.pts} points · best game ${C.best} pts</p>`, true);
  drawAvatar(document.getElementById('av'));
  bind('bPlay', startMatch); bind('bUp', upgrade); bind('bTrain', training); bind('bTable', standings); bind('bSet', settings);
}
function upgrade(){
  state = 'card';
  showOv(`<h2>⬆ Upgrade your player</h2><div class="info">Skill points: <b>${C.sp}</b> · each point adds <b>+3</b> to a skill</div>
    ${STATS.map(([k, n, e]) => `<div class="up"><span class="n">${e} <b>${n}</b><div class="bar"><i style="width:${C.stats[k]}%"></i></div></span><b style="width:30px">${C.stats[k]}</b>
      <button class="ok" data-s="${k}" ${C.sp < 1 || C.stats[k] >= 99 ? 'disabled' : ''}>+3</button></div>`).join('')}
    <p>Overall: <b>${ovr()} OVR</b> · ${rankOf(ovr())[2]} ${rankOf(ovr())[1]}</p>
    <p class="small">Earn points by playing games (score, rebound, assist, steal, block and win!) and by training.</p>
    <button id="bHub">Done</button>`);
  ov.querySelectorAll('button[data-s]').forEach(el => el.onclick = () => { const k = el.dataset.s; if (C.sp < 1 || C.stats[k] >= 99) return;
    C.sp--; C.stats[k] = Math.min(99, C.stats[k] + 3); saveCareer(); sfx.up(); upgrade(); });
  bind('bHub', hub);
}
function training(){
  state = 'card';
  showOv(`<h2>💪 Training</h2><div class="info">Energy: <b>${C.energy}/2</b> drills. Playing a game refills your energy.</div>
    <p>Each drill gives up to <b>3 skill points</b>.</p>
    <button id="d1" ${C.energy < 1 ? 'disabled' : ''}>🎯 Shooting Drill</button>
    <button id="d2" ${C.energy < 1 ? 'disabled' : ''}>⛹️ Dribble Drill</button>
    <button id="d3" ${C.energy < 1 ? 'disabled' : ''}>🛡️ Steal Drill</button><br>
    <button id="bHub" class="alt">Back</button>`);
  bind('d1', () => startDrill('shoot')); bind('d2', () => startDrill('dribble')); bind('d3', () => startDrill('defense')); bind('bHub', hub);
}
function standings(){
  state = 'card';
  const rows = Object.entries(C.standings).sort((a, b) => (b[1][0] - b[1][1]) - (a[1][0] - a[1][1]));
  showOv(`<h2>📊 Season ${C.season} Standings</h2><table><tr><th>#</th><th>Team</th><th>W</th><th>L</th></tr>
    ${rows.map(([n, [w, l]], i) => `<tr class="${n === C.team ? 'me' : ''}"><td>${i + 1}</td><td style="text-align:left">${esc(n)}</td><td>${w}</td><td>${l}</td></tr>`).join('')}</table>
    <p class="small">Play all ${LEAGUE.length} teams, then the Finals against the best team. Win the Finals to earn a 🏆.</p>
    <p><b>Your teammates:</b> ${C.mates.map(m => `${esc(m.name)} (#${m.num}, ${m.pos})`).join(', ')}. Their rating grows as you get better: <b>${mateRating()}</b>.</p>
    <button id="bHub">Back</button>`);
  bind('bHub', hub);
}
function settings(){
  state = 'card';
  showOv(`<h2>⚙️ Settings</h2><div class="lbl">Quarter length</div><div class="opts">${Object.keys(QLENS).map(k => `<div class="opt${C.qlen === k ? ' sel' : ''}" data-q="${k}">${k} (${QLENS[k]}s)</div>`).join('')}</div>
    <button id="bHub">Back</button><button id="bReset" class="alt">Delete career</button>`);
  ov.querySelectorAll('[data-q]').forEach(el => el.onclick = () => { C.qlen = el.dataset.q; saveCareer(); sfx.click(); settings(); });
  bind('bHub', hub); bind('bReset', () => { if (confirm('Delete this career for good?')){ localStorage.removeItem(STORE); C = null; title(); } });
}
function pauseMenu(){
  state = 'paused'; showTouch(false);
  showOv(`<h2>⏸ Paused</h2><p>${M.teams[0].name} ${M.teams[0].score} – ${M.teams[1].score} ${M.teams[1].name}</p>
    <button id="bRes" class="ok">Resume</button><button id="bQuit" class="alt">Quit game (no reward)</button>`);
  bind('bRes', () => { state = 'game'; hideOv(); showTouch(true, false); }); bind('bQuit', hub);
}

// ====================================================================== main loop
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now; const t = now/1000;
  if (state === 'game'){ if (pressed.escape || pressed.p) pauseMenu(); else update(dt); }
  if (state === 'drill') updateDrill(dt);
  ctx.clearRect(0, 0, W, H);
  if (M && (state === 'game' || state === 'paused' || (state === 'card' && M.over))) drawMatch(t);
  else if (state === 'drill' && D) drawDrill(t);
  else { drawCourt(C ? C.color : COLORS[0]); drawHoopBack(HOOP[0]); drawHoopBack(HOOP[1]); drawHoopFront(HOOP[0], t); drawHoopFront(HOOP[1], t);
    drawBall(ctx, 480 + Math.sin(t*1.3)*300, 300 - Math.abs(Math.sin(t*3))*120, 9); }
  for (const k in pressed) delete pressed[k]; for (const k in released) delete released[k];
  requestAnimationFrame(frame);
}
addEventListener('keydown', e => { if (e.key === 'Enter' && (state === 'hub' || state === 'card' || state === 'title')){ const b = ov.querySelector('button.ok, button'); if (b && document.activeElement.tagName !== 'INPUT') b.click(); } });
loadCareer();
title();
requestAnimationFrame(frame);
window.__bb = { get M(){ return M; }, get C(){ return C; }, set C(v){ C = v; }, get state(){ return state; }, get D(){ return D; }, startMatch, update, shotChance, hub, ovr, finishMatch, startDrill, saveCareer, endQuarter };
</script>
</body>
