<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lights Out Sleepover</title>
<style>
  html,body{margin:0;height:100%;background:#05040a;overflow:hidden;touch-action:none;
    font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:#eee;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,15,.82);z-index:5}
  .ov.hidden{display:none}
  .card{max-width:560px;margin:16px;padding:26px 28px;border-radius:18px;background:#16112b;border:2px solid #4b3b8f;
    box-shadow:0 0 40px rgba(120,80,255,.35);text-align:center}
  .card h1{margin:0 0 8px;font-size:40px;letter-spacing:2px;color:#ffe9a0;text-shadow:0 0 18px rgba(255,220,120,.6)}
  .card h2{margin:0 0 8px;font-size:32px;color:#ffe9a0}
  .card p{line-height:1.45;margin:10px 0;color:#d8d2f5}
  .card .small{font-size:14px;color:#a49bd0}
  button.big{font:inherit;font-size:20px;font-weight:bold;margin:8px;padding:12px 22px;border-radius:12px;border:2px solid #ffe9a0;
    background:#2b2152;color:#ffe9a0;cursor:pointer}
  button.big:hover{background:#3d2f73}
  button.big.scary{border-color:#ff7a7a;color:#ffb3b3}
  #skip{position:fixed;top:12px;right:12px;z-index:4;font:inherit;font-size:15px;padding:8px 14px;border-radius:10px;
    border:1px solid #8a7cc9;background:rgba(30,20,60,.7);color:#d8d2f5;cursor:pointer;display:none}
  #flashBtn{position:fixed;right:22px;bottom:22px;width:92px;height:92px;border-radius:50%;z-index:4;
    border:3px solid #ffe9a0;background:rgba(255,233,160,.16);color:#ffe9a0;font:inherit;font-weight:bold;font-size:15px;display:none}
  #muteBtn{position:fixed;bottom:12px;left:12px;z-index:4;font-size:18px;padding:4px 8px;border-radius:8px;border:1px solid #554a88;
    background:rgba(30,20,60,.6);color:#d8d2f5;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="skip">Skip ▶</button>
<button id="flashBtn">FLASH<br>🔦</button>
<button id="muteBtn" title="Sound on/off">🔊</button>
<div id="ov" class="ov"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
const W = 960, H = 640;
let scale = 1, dpr = 1;
function resize(){
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W*scale + 'px'; cv.style.height = H*scale + 'px';
  cv.width = Math.round(W*scale*dpr); cv.height = Math.round(H*scale*dpr);
  dark.width = cv.width; dark.height = cv.height;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  dctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
addEventListener('resize', resize); resize();

const ov = document.getElementById('ov'), card = document.getElementById('card');
const skipBtn = document.getElementById('skip'), flashBtn = document.getElementById('flashBtn'), muteBtn = document.getElementById('muteBtn');
let isTouch = false, bloodOn = true;
try { bloodOn = localStorage.getItem('sleepoverBlood') !== 'off'; } catch(e) {}

// ---------- audio (synth, no files) ----------
let ac = null, muted = false;
function audio(){
  if (!ac) { try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, d, type='sine', v=0.15, f2){
  if (!ac || muted) return;
  const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+d+0.05);
}
function noise(d, v){
  if (!ac || muted) return;
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate*d), ac.sampleRate), ch = b.getChannelData(0);
  for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * (1 - i/ch.length);
  const src = ac.createBufferSource(), g = ac.createGain(); g.gain.value = v;
  src.buffer = b; src.connect(g); g.connect(ac.destination); src.start();
}
const sfx = {
  roar(){ tone(200,1.0,'sawtooth',0.18,45); tone(130,1.0,'square',0.07,40); },
  beat(){ tone(70,0.12,'sine',0.45,40); setTimeout(()=>tone(60,0.12,'sine',0.35,35),140); },
  chime(){ tone(660,0.12,'triangle',0.15); setTimeout(()=>tone(990,0.25,'triangle',0.15),110); },
  battery(){ tone(520,0.1,'square',0.06); setTimeout(()=>tone(780,0.12,'square',0.06),90); },
  flash(){ tone(1400,0.35,'triangle',0.12,300); },
  buzz(){ tone(95,0.25,'square',0.035,80); },
  whoosh(){ tone(400,0.5,'sine',0.08,120); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.15),i*140)); },
  click(){ tone(300,0.05,'square',0.04); },
  scream(){ tone(700,0.6,'sawtooth',0.05,1300); tone(720,0.6,'triangle',0.06,1350); },
  chomp(){ noise(0.3,0.6); tone(110,0.35,'square',0.22,35); },
  chew(){ noise(0.07,0.18); },
  fart(){
    if (!ac || muted) return;
    const t0 = ac.currentTime + 0.03, dur = 2.1, out = ac.createGain(); out.gain.value = 0.9; out.connect(ac.destination);
    // the "voice": a low buzzy tone with wobbly pitch
    const o = ac.createOscillator(), o2 = ac.createOscillator(); o.type = 'sawtooth'; o2.type = 'square';
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 5;
    const flap = ac.createGain(), env = ac.createGain(), o2g = ac.createGain(); o2g.gain.value = 0.35;
    o.connect(flap); o2.connect(o2g); o2g.connect(flap); flap.connect(lp); lp.connect(env); env.connect(out);
    let f = 105;
    for (let tt = 0; tt < dur; tt += 0.025){
      const end = tt > dur - 0.35;
      f = end ? 120 + (tt - (dur-0.35))*500 : Math.max(48, f*(0.985 + Math.random()*0.03) + (Math.random()-0.5)*14);
      o.frequency.setValueAtTime(f, t0 + tt); o2.frequency.setValueAtTime(f*0.5 + Math.random()*4, t0 + tt);
      lp.frequency.setValueAtTime(end ? 1400 : 380 + Math.random()*500, t0 + tt);
    }
    // flutter: the flapping that makes it sound real
    let tt = 0;
    while (tt < dur){ const r = 1/(16 + Math.random()*22); flap.gain.setValueAtTime(1, t0 + tt); flap.gain.setValueAtTime(0.08 + Math.random()*0.2, t0 + tt + r*0.55); tt += r; }
    // loudness: a big blast, uneven swells, then sputters... and a little squeak
    env.gain.setValueAtTime(0.0001, t0); env.gain.exponentialRampToValueAtTime(0.75, t0 + 0.03);
    env.gain.setValueAtTime(0.75, t0 + 0.25); env.gain.linearRampToValueAtTime(0.45, t0 + 0.6);
    env.gain.linearRampToValueAtTime(0.65, t0 + 0.9); env.gain.linearRampToValueAtTime(0.35, t0 + 1.25);
    for (const [a, b] of [[1.32, 0.42], [1.5, 0.28], [1.62, 0.3], [1.78, 0.2]]){ env.gain.setValueAtTime(0.0001, t0 + a - 0.05); env.gain.setValueAtTime(b, t0 + a); env.gain.setValueAtTime(0.0001, t0 + a + 0.07); }
    env.gain.setValueAtTime(0.0001, t0 + dur - 0.3); env.gain.linearRampToValueAtTime(0.18, t0 + dur - 0.22); env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
    // wet, airy hiss on top
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate*dur), ac.sampleRate), ch = b.getChannelData(0);
    for (let i=0;i<ch.length;i++) ch[i] = Math.random()*2-1;
    const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), ng = ac.createGain(); n.buffer = b; bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = 1.2;
    ng.gain.setValueAtTime(0.0001, t0); ng.gain.exponentialRampToValueAtTime(0.5, t0 + 0.03); ng.gain.linearRampToValueAtTime(0.2, t0 + 1.2); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    n.connect(bp); bp.connect(ng); ng.connect(flap); n.start(t0);
    // low thump at the start
    tone(48, 0.25, 'sine', 0.4, 30);
  },
  choir(){ [[523,659,784],[587,740,880],[659,830,988]].forEach((c,i) => setTimeout(() => c.forEach(f => { tone(f, 1.4, 'sine', 0.05); tone(f*2, 1.4, 'triangle', 0.015); }), i*700)); },
  candy(){ [784,988,1175,1568,1319,1568].forEach((f,i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.1), 300 + i*170)); },
  whisper(){ for (let i=0;i<6;i++) setTimeout(() => { noise(0.35, 0.05); tone(180 + Math.random()*80, 0.35, 'sine', 0.02, 120); }, i*260); }
};
muteBtn.onclick = (e) => { e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; };

// ---------- helpers ----------
const rand = (a,b) => a + Math.random()*(b-a);
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function wrapText(text, maxW){
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words){ const test = line ? line+' '+w : w;
    if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}

// ---------- characters ----------
const KIDS = {
  Maya: { bag:'#c9407f', skin:'#c68a5c', hair:'#1f130c', pj:'#e05a9a', eye:'#5a3415', style:'long' },
  Sam:  { bag:'#2f86c0', skin:'#f3cfaa', hair:'#d9a441', pj:'#3fa6e0', eye:'#3a7ad0', style:'messy', freckles:true },
  Leo:  { bag:'#3f9a52', skin:'#8a5536', hair:'#140c0a', pj:'#56c26a', eye:'#3b2414', style:'cap' },
  You:  { bag:'#d97a2a', skin:'#eebf94', hair:'#6b3e1c', pj:'#ff9a3c', eye:'#3d6b3a', style:'side' },
};
function shade(hex, f){
  const n = parseInt(hex.slice(1),16), m = f < 0 ? 0 : 255, a = Math.abs(f);
  const c = [n>>16, (n>>8)&255, n&255].map(v => Math.round(v + (m - v)*a));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function ell(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); }

function drawHead(cx,cy,R,k,scared,t){
  ctx.save(); ctx.lineCap = 'round';
  // long hair behind the head
  if (k.style === 'long'){
    const hg = ctx.createLinearGradient(cx, cy-R, cx, cy+R*1.6);
    hg.addColorStop(0, shade(k.hair,0.15)); hg.addColorStop(1, k.hair);
    ctx.fillStyle = hg; ctx.beginPath(); ctx.moveTo(cx-R*1.02,cy-R*0.3);
    ctx.quadraticCurveTo(cx-R*1.3,cy+R*1.2,cx-R*0.75,cy+R*1.6); ctx.lineTo(cx+R*0.75,cy+R*1.6);
    ctx.quadraticCurveTo(cx+R*1.3,cy+R*1.2,cx+R*1.02,cy-R*0.3); ctx.closePath(); ctx.fill();
  }
  // neck
  ctx.fillStyle = shade(k.skin,-0.22); ctx.fillRect(cx-R*0.3, cy+R*0.65, R*0.6, R*0.55);
  // ears
  for (const sd of [-1,1]){ ctx.fillStyle = k.skin; ell(cx+sd*R*0.9, cy+R*0.05, R*0.18, R*0.26);
    ctx.fillStyle = shade(k.skin,-0.2); ell(cx+sd*R*0.92, cy+R*0.05, R*0.08, R*0.14); }
  // face with soft shading
  const g = ctx.createRadialGradient(cx-R*0.3,cy-R*0.35,R*0.1,cx,cy,R*1.1);
  g.addColorStop(0, shade(k.skin,0.2)); g.addColorStop(0.65, k.skin); g.addColorStop(1, shade(k.skin,-0.25));
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(cx-R*0.88, cy-R*0.1);
  ctx.bezierCurveTo(cx-R*0.9, cy-R*1.15, cx+R*0.9, cy-R*1.15, cx+R*0.88, cy-R*0.1);
  ctx.bezierCurveTo(cx+R*0.85, cy+R*0.7, cx+R*0.35, cy+R*1.0, cx, cy+R*1.0);
  ctx.bezierCurveTo(cx-R*0.35, cy+R*1.0, cx-R*0.85, cy+R*0.7, cx-R*0.88, cy-R*0.1);
  ctx.fill();
  // cheeks + freckles
  ctx.fillStyle = 'rgba(225,80,80,.16)'; ell(cx-R*0.5, cy+R*0.35, R*0.2, R*0.13); ell(cx+R*0.5, cy+R*0.35, R*0.2, R*0.13);
  if (k.freckles){ ctx.fillStyle = 'rgba(150,80,40,.45)';
    for (const [fx,fy] of [[-.55,.2],[-.45,.28],[-.6,.32],[.55,.2],[.45,.28],[.6,.32]]) ell(cx+fx*R, cy+fy*R, R*0.03, R*0.03); }
  // eyes
  const ey = cy - R*0.05, ex = R*0.35;
  for (const sd of [-1,1]){
    const x = cx + sd*ex, wh = scared ? R*0.19 : R*0.13;
    ctx.fillStyle = '#fbfbf7'; ell(x, ey, R*0.2, wh);
    const ir = scared ? R*0.075 : R*0.1, lx = scared ? sd*R*0.02 : 0;
    const ig = ctx.createRadialGradient(x+lx, ey, ir*0.2, x+lx, ey, ir);
    ig.addColorStop(0, shade(k.eye,0.35)); ig.addColorStop(1, k.eye);
    ctx.fillStyle = ig; ell(x+lx, ey, ir, Math.min(ir, wh));
    ctx.fillStyle = '#0b0b0b'; ell(x+lx, ey, ir*0.45, Math.min(ir*0.45, wh));
    ctx.fillStyle = '#fff'; ell(x+lx-ir*0.35, ey-ir*0.35, ir*0.22, ir*0.22);
    ctx.strokeStyle = shade(k.skin,-0.5); ctx.lineWidth = Math.max(1, R*0.04);
    ctx.beginPath(); ctx.ellipse(x, ey, R*0.2, wh, 0, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
  }
  // eyebrows
  ctx.strokeStyle = shade(k.hair,-0.2); ctx.lineWidth = Math.max(1.5, R*0.08);
  for (const sd of [-1,1]){
    ctx.beginPath();
    if (scared){ ctx.moveTo(cx+sd*R*0.55, ey-R*0.24); ctx.quadraticCurveTo(cx+sd*R*0.35, ey-R*0.36, cx+sd*R*0.13, ey-R*0.42); }
    else { ctx.moveTo(cx+sd*R*0.55, ey-R*0.24); ctx.quadraticCurveTo(cx+sd*R*0.35, ey-R*0.34, cx+sd*R*0.14, ey-R*0.28); }
    ctx.stroke();
  }
  // nose
  ctx.strokeStyle = shade(k.skin,-0.32); ctx.lineWidth = Math.max(1, R*0.05);
  ctx.beginPath(); ctx.moveTo(cx-R*0.02, ey+R*0.12); ctx.quadraticCurveTo(cx-R*0.13, cy+R*0.3, cx+R*0.05, cy+R*0.3); ctx.stroke();
  // mouth
  if (scared){
    ctx.fillStyle = '#3a0f12'; ell(cx, cy+R*0.58, R*0.17, R*0.22);
    ctx.fillStyle = '#f4f1ea'; ctx.fillRect(cx-R*0.11, cy+R*0.38, R*0.22, R*0.06);
    ctx.fillStyle = '#c9545e'; ell(cx, cy+R*0.72, R*0.1, R*0.06);
  } else {
    ctx.fillStyle = '#5a1a1a'; ctx.beginPath(); ctx.moveTo(cx-R*0.28, cy+R*0.42);
    ctx.quadraticCurveTo(cx, cy+R*0.78, cx+R*0.28, cy+R*0.42); ctx.quadraticCurveTo(cx, cy+R*0.5, cx-R*0.28, cy+R*0.42); ctx.fill();
    ctx.fillStyle = '#f4f1ea'; ctx.beginPath(); ctx.moveTo(cx-R*0.22, cy+R*0.46);
    ctx.quadraticCurveTo(cx, cy+R*0.56, cx+R*0.22, cy+R*0.46); ctx.quadraticCurveTo(cx, cy+R*0.5, cx-R*0.22, cy+R*0.46); ctx.fill();
  }
  // hair on top
  const hg2 = ctx.createLinearGradient(cx, cy-R*1.1, cx, cy-R*0.2);
  hg2.addColorStop(0, shade(k.hair,0.2)); hg2.addColorStop(1, k.hair);
  ctx.fillStyle = hg2;
  ctx.beginPath(); ctx.ellipse(cx, cy-R*0.38, R*0.97, R*0.72, 0, Math.PI, 0); ctx.fill();
  if (k.style === 'long'){
    ctx.beginPath(); ctx.moveTo(cx+R*0.95,cy-R*0.4); ctx.quadraticCurveTo(cx+R*0.1,cy-R*0.6,cx-R*0.6,cy-R*0.15);
    ctx.quadraticCurveTo(cx-R*0.3,cy-R*0.7,cx-R*0.95,cy-R*0.4); ctx.closePath(); ctx.fill();
    ctx.fillRect(cx-R*1.0, cy-R*0.4, R*0.18, R*1.1); ctx.fillRect(cx+R*0.82, cy-R*0.4, R*0.18, R*1.1);
  } else if (k.style === 'messy'){
    for (let i=0;i<7;i++){ const a = Math.PI*(1.05 + i*0.15), bx = cx+Math.cos(a)*R*0.9, by = cy-R*0.38+Math.sin(a)*R*0.75;
      ctx.beginPath(); ctx.moveTo(bx-R*0.15,by+R*0.1); ctx.lineTo(bx+Math.cos(a)*R*0.25+R*0.05, by+Math.sin(a)*R*0.25); ctx.lineTo(bx+R*0.15,by+R*0.12); ctx.fill(); }
    ctx.beginPath(); ctx.moveTo(cx-R*0.8,cy-R*0.4); ctx.lineTo(cx-R*0.5,cy-R*0.2); ctx.lineTo(cx-R*0.3,cy-R*0.42);
    ctx.lineTo(cx,cy-R*0.22); ctx.lineTo(cx+R*0.25,cy-R*0.42); ctx.lineTo(cx+R*0.55,cy-R*0.22); ctx.lineTo(cx+R*0.85,cy-R*0.4); ctx.fill();
  } else if (k.style === 'side'){
    ctx.beginPath(); ctx.moveTo(cx-R*0.95,cy-R*0.4); ctx.quadraticCurveTo(cx-R*0.2,cy-R*0.15,cx+R*0.6,cy-R*0.3);
    ctx.quadraticCurveTo(cx+R*0.8,cy-R*0.45,cx+R*0.95,cy-R*0.4); ctx.closePath(); ctx.fill();
  } else if (k.style === 'cap'){
    const cg = ctx.createLinearGradient(cx, cy-R*1.15, cx, cy-R*0.3);
    cg.addColorStop(0,'#ff5a4e'); cg.addColorStop(1,'#a8171c');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(cx, cy-R*0.4, R*1.0, R*0.78, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#8c1015'; ctx.beginPath(); ctx.ellipse(cx+R*0.25, cy-R*0.38, R*0.95, R*0.14, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(R*0.35)}px Verdana, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('L', cx, cy-R*0.6); ctx.textAlign = 'left';
  }
  // hair shine
  if (k.style !== 'cap'){ ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = Math.max(1, R*0.06);
    ctx.beginPath(); ctx.ellipse(cx-R*0.1, cy-R*0.45, R*0.6, R*0.45, 0, Math.PI*1.2, Math.PI*1.6); ctx.stroke(); }
  ctx.restore();
}

// Kid sitting up in a sleeping bag (intro)
function drawKid(x,y,k,scared,t){
  const shake = scared ? Math.sin(t*40)*1.5 : 0;
  ctx.fillStyle = '#e4def2'; rr(x-56,y-70,112,44,20); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.08)'; rr(x-56,y-44,112,18,10); ctx.fill();
  // shirt + arms
  const sg = ctx.createLinearGradient(x-40, 0, x+40, 0);
  sg.addColorStop(0, shade(k.pj,-0.25)); sg.addColorStop(0.4, k.pj); sg.addColorStop(1, shade(k.pj,-0.3));
  ctx.fillStyle = sg; rr(x-42,y-20,84,50,22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(x-30,y-6,60,5);
  drawHead(x+shake, y-50, 31, k, scared, t);
  // sleeping bag with quilting
  const bg = ctx.createLinearGradient(x, y+8, x, y+96);
  bg.addColorStop(0, shade(k.bag,0.15)); bg.addColorStop(1, shade(k.bag,-0.35));
  ctx.fillStyle = bg; rr(x-66,y+10,132,86,30); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;

function stageCleared(){

  if (stage === 1){ if (mode === 'online') net.sendPhase('win2'); win2(); return; }

function checkDoor(){

    doorOpen = true;

  }
}
function setMsg(t, d=3.5){ msg = t; msgT = d; msgSeq++; }

function alivePlayers(){ return players.filter(p => p.alive && !p.gone); }
function nearestPlayer(x, y){
  let best = null, bd = 1e9;
  for (const p of alivePlayers()){ const d = Math.hypot(p.x-x, p.y-y); if (d < bd){ bd = d; best = p; } }
  return [best, bd];
}

function bfs(){
  distField.fill(-1);
  const q = []; let h = 0;
  for (const p of alivePlayers()){
    const pc = Math.floor(p.x/T), pr = Math.floor(p.y/T);
    if (solidFor(tileAt(pc,pr), true)) continue;
    const i = pc + pr*COLS; if (distField[i] === -1){ distField[i] = 0; q.push(i); }
  }
  while (h < q.length){
    const i = q[h++], c = i % COLS, r = (i / COLS) | 0, d = distField[i];
    for (const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc = c+dc, nr = r+dr; if (nc<0||nr<0||nc>=COLS||nr>=ROWS) continue;
      const ni = nc + nr*COLS;
      if (distField[ni] === -1 && !solidFor(grid[nr][nc], true)){ distField[ni] = d+1; q.push(ni); }
    }
  }
}

function chooseNext(m){
  const c = m.tx, r = m.ty, dd = distField[c + r*COLS], chase = DIFF[difficulty].chase + (stage === 0 ? foundCount : 2 + stage);
  const nbrs = [[1,0],[-1,0],[0,1],[0,-1]].map(([dc,dr]) => [c+dc, r+dr]).filter(([nc,nr]) => !solidFor(tileAt(nc,nr), true));
  let next = null;
  if (dd >= 0 && dd <= chase){
    m.chasing = true;
    const better = nbrs.filter(([nc,nr]) => distField[nc+nr*COLS] === dd-1);
    next = better.length ? better[(Math.random()*better.length)|0] : [c, r];
  } else {
    m.chasing = false;
    const opts = nbrs.filter(([nc,nr]) => !(nc === m.pc && nr === m.pr));
    next = opts.length ? opts[(Math.random()*opts.length)|0] : (nbrs[0] || [c,r]);
  }
  m.pc = c; m.pr = r; m.tx = next[0]; m.ty = next[1];
}

const KEYSETS = {
  all: { l:['arrowleft','a'], r:['arrowright','d'], u:['arrowup','w'], d:['arrowdown','s'] },
  p1:  { l:['a'], r:['d'], u:['w'], d:['s'] },
  p2:  { l:['arrowleft'], r:['arrowright'], u:['arrowup'], d:['arrowdown'] },
};
function inputVec(ctrl){
  const ks = KEYSETS[ctrl] || KEYSETS.all; let vx = 0, vy = 0;
  if (ks.l.some(k => keys[k])) vx -= 1;
  if (ks.r.some(k => keys[k])) vx += 1;
  if (ks.u.some(k => keys[k])) vy -= 1;
  if (ks.d.some(k => keys[k])) vy += 1;
  if (ctrl !== 'p2' && joy.id !== null){
    const jx = (joy.x-joy.ox), jy = (joy.y-joy.oy), jl = Math.hypot(jx,jy);
    if (jl > 8){ const k = Math.min(1, jl/50); vx = jx/jl*k; vy = jy/jl*k; }
  }
  const vl = Math.hypot(vx,vy); if (vl > 1){ vx/=vl; vy/=vl; }
  return [vx, vy];
}

function requestFlash(p){

}
function doAttack(p){

  const near = monsters.filter(m => m.goon && !m.dead && m.active && Math.hypot(m.x - p.x, m.y - p.y) < 140); if (near.length) bs = near;
  const k = bs.reduce((b, m) => Math.hypot(m.x - p.x, m.y - p.y) < Math.hypot(b.x - p.x, b.y - p.y) ? m : b);
  const a = Math.atan2(k.y - p.y, k.x - p.x), spear = !!p.spear, sp = spear ? 360 : 540;
  p.spear = false; p.atkCd = spear ? 0.5 : 0.28;
  shots.push({ x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, k: spear ? 1 : 0, life:2.5 });

}
function doFlash(p){
  if (isBoss()){ doAttack(p); return; }

  if (charges <= 0){ setMsg("The flashlight is out of power! Find a battery 🔋", 2.5); return; }

// ---------- update ----------
function blocked(x,y,r){
  for (const [dx,dy] of [[-r,-r],[r,-r],[-r,r],[r,r]]){
    if (solidFor(tileAt(Math.floor((x+dx)/T), Math.floor((y+dy)/T)), false)) return true;
  }
  return false;
}
function movePlayer(p, vx, vy, dt){
  const vl = Math.hypot(vx, vy), step = 135*dt;
  p.moving = vl > 0.1;
  if (p.moving) p.dir = Math.atan2(vy,vx);
  let nx = p.x + vx*step;
  if (!blocked(nx, p.y, p.r)) p.x = nx;
  else if (Math.abs(vx) > 0.3 && Math.abs(vy) < 0.3){ const cy = Math.floor(p.y/T)*T + T/2, d = cy - p.y; p.y += Math.sign(d) * Math.min(Math.abs(d), step); }
  let ny = p.y + vy*step;
  if (!blocked(p.x, ny, p.r)) p.y = ny;
  else if (Math.abs(vy) > 0.3 && Math.abs(vx) < 0.3){ const cx = Math.floor(p.x/T)*T + T/2, d = cx - p.x; p.x += Math.sign(d) * Math.min(Math.abs(d), step); }
}
function respawnPlayer(p){
  const [c, r] = spawnTiles[p.spawn % 4];
  p.alive = true; p.grace = 2.5; p.rseq++; p.trail = [];
  if (p.local){ p.x = c*T+T/2; p.y = r*T+T/2; }
  setMsg(`${p.label === 'YOU' ? 'You are' : p.label + ' is'} back at the start. Careful!`, 2.5);
}
function catchPlayer(p, how){
  lives--; p.alive = false; p.respawn = isBoss() ? 2.5 : 3.5; p.spear = false;
  if (how !== 'fire') decals.push({ x:p.x, y:p.y, kid:p.kid });
  if (how === 'fire'){ noise(0.4, 0.4); sfx.scream(); } else { sfx.chomp(); sfx.scream(); }
  if (lives <= 0){ lastCaughtKid = p.kid; if (mode === 'online') net.sendPhase('lose'); lose(); return true; }
  if (isBoss()) setMsg(`${how === 'fire' ? '🔥 FIREBALL!' : 'CHOMP!'} ${p.label === 'YOU' ? 'You got' : p.label + ' got'} hit! ${lives} ${lives === 1 ? 'heart' : 'hearts'} left`, 3);
  else setMsg(`CHOMP! ${p.label === 'YOU' ? 'Your' : p.label + "'s"} head got bitten off! ${lives} ${lives === 1 ? 'life' : 'lives'} left`, 3.5);
  return false;
}

function update(dt){
  gameT += dt; flashT -= dt; flashCd -= dt; if (msgT > 0) msgT -= dt;
  for (const p of players){
    if (p.local){ if (p.alive){ const [vx,vy] = inputVec(p.ctrl); movePlayer(p, vx, vy, dt); } else p.moving = false; }
    else { p.x += (p.tx - p.x)*Math.min(1, dt*12); p.y += (p.ty - p.y)*Math.min(1, dt*12); p.moving = p.rmv; }
    if (p.moving){ p.trail.push({x:p.x, y:p.y}); if (p.trail.length > 200) p.trail.shift(); }
    p.grace -= dt;
  }
  if (mode === 'online'){ net.tick(dt); if (state !== 'play') return; }
  const host = mode !== 'online' || net.role === 'host';
  if (host){
    for (const p of players) if (!p.alive && !p.gone){ p.respawn -= dt; if (p.respawn <= 0) respawnPlayer(p); }
    // friends
    for (const f of friends){
      if (!f.found){
        for (const p of alivePlayers()) if (Math.hypot(f.x-p.x, f.y-p.y) < 30){
          f.found = true; f.order = foundCount++; f.leader = p.id; sfx.chime();
          setMsg(STAGES[stage].rescue ? "Sam: \"You came for me!! The Devil King wanted me as his BUTLER! Get me out of here!\"" : FRIEND_LINES[f.name], 3.5);
          if (STAGES[stage].rescue){ sfx.roar(); setTimeout(() => { if (state === 'play') setMsg("DEVIL KING: \"NOOO! You can't take my butler! GET THEM!\"", 3.5); }, 3600); }
          checkDoor();
          break;
        }
      }
      if (f.found){
        const L = players.find(p => p.id === f.leader && !p.gone) || player;
        const idx = L.trail.length - 1 - (f.order+1)*12;
        const tp = L.trail[Math.max(0, idx)] || L;
        f.x += (tp.x - f.x) * Math.min(1, dt*10); f.y += (tp.y - f.y) * Math.min(1, dt*10);
        f.dir = L.dir;
      }
    }
    for (const b of batteries) if (!b.taken) for (const p of alivePlayers()) if (Math.hypot(b.x-p.x, b.y-p.y) < 24){
      b.taken = true; charges = Math.min(5, charges+1); sfx.battery(); setMsg("+1 flashlight power! 🔋", 2.5); break;
    }
    for (const it of items) if (!it.taken) for (const p of alivePlayers()) if (Math.hypot(it.x-p.x, it.y-p.y) < 24){
      if (it.kind === 'spear'){ if (p.spear) continue; it.taken = true; it.rt = 7; p.spear = true; sfx.battery(); setMsg(`${p.label === 'YOU' ? 'You' : p.label} grabbed a GOLDEN SPEAR! The next shot hits HARD! 🔱`, 2.5); break; }
      it.taken = true; sfx.chime();
      const left = items.filter(i => !i.taken).length;
      setMsg(it.kind === 'key' ? (left ? `Got a key! 🔑 ${left} more to find.` : 'Got all the keys! 🔑') : (left ? `Power switch ON! ⚡ ${left} more.` : 'All the power is back ON! ⚡'), 3);
      checkDoor(); break;
    }
    if (doorOpen) for (const p of alivePlayers()) if (Math.floor(p.x/T) === doorPos[0] && Math.floor(p.y/T) === doorPos[1]){
      stageCleared(); return;
    }
    if (isBoss()){
      bossLeft -= dt; if (bossLeft <= 0){ bossLeft = 0; kingLose(); return; }
      for (const p of players) p.atkCd = (p.atkCd || 0) - dt;
      for (const it of items) if (it.taken){ it.rt -= dt; if (it.rt <= 0) it.taken = false; }
      const bosses = monsters.filter(m => m.boss && !m.dead);
      for (const k of bosses) if (k.active){
        k.fireT -= dt;
        const [tp] = nearestPlayer(k.x, k.y), angry = k.hp < k.max/2;
        if (k.fireT <= 0 && tp){
          const a = Math.atan2(tp.y - k.y, tp.x - k.x), n = angry ? 3 : 1, sp = (difficulty === 'scary' ? 200 : 165)*(k.kind === 'candy' ? 0.9 : 1);
          for (let i=0;i<n;i++){ const b = a + (i - (n-1)/2)*0.3; shots.push({ x:k.x, y:k.y - 8, vx:Math.cos(b)*sp, vy:Math.sin(b)*sp, k: k.kind === 'candy' ? 3 : 2, life:5 }); }
          k.fireT = (angry ? 1.0 : 1.5)*(bosses.length > 1 ? 1.35 : 1);
          if (k.kind === 'candy') tone(900, 0.15, 'square', 0.04, 600); else { tone(160, 0.35, 'sawtooth', 0.07, 60); noise(0.25, 0.1); }
        }
      }
      for (const cmn of bosses) if (cmn.active && (cmn.kind === 'candy' || cmn.kind === 'prince')){
        cmn.goonT -= dt;
        if (cmn.goonT <= 0){ cmn.goonT = 9; if (monsters.filter(m => m.goon && !m.dead).length < (isMulti() ? 8 : 5)){
          const imp = cmn.kind === 'prince'; spawnGoon(cmn.x, cmn.y + T, 0.6, imp);
          if (imp){ tone(220, 0.3, 'sawtooth', 0.06, 500); setMsg('The Devil Prince summons a FIRE IMP! 😈', 2); } else { tone(700, 0.2, 'sine', 0.06, 1200); setMsg('The Candy Man summons another GUMMY GOON! 🐻', 2); } } }
      }
      for (let i = shots.length - 1; i >= 0; i--){
        const sh = shots[i]; sh.x += sh.vx*dt; sh.y += sh.vy*dt; sh.life -= dt;
        const tch = tileAt(Math.floor(sh.x/T), Math.floor(sh.y/T));
        if (sh.life <= 0 || tch === '#'){ shots.splice(i, 1); continue; }
        if (sh.k < 2){
          const gh = monsters.find(m => m.goon && !m.dead && m.active && Math.hypot(sh.x - m.x, sh.y - m.y) < 15);
          if (gh){ shots.splice(i, 1); gh.dead = true; gh.active = false; decals.push({ x:gh.x, y:gh.y, goo: gh.imp ? '#3a0a10' : GUMMY_COLS[gh.col] }); gh.x = gh.nx = -999; gh.y = gh.ny = -999; tone(500, 0.15, 'square', 0.08, 120); noise(0.1, 0.15); continue; }
          const k = bosses.find(b => b.active && !b.dead && Math.hypot(sh.x - b.x, sh.y - b.y) < 34);
          if (k){
            shots.splice(i, 1); k.hp = Math.max(0, k.hp - (sh.k ? 5 : 1)); k.hit = 0.15; tone(sh.k ? 140 : 220, 0.12, 'square', 0.1, 90);
            if (sh.k) setMsg(`SPEAR HIT! ${BOSS_NAMES[k.kind]} roars in pain! 🔱`, 2);
            if (k.hp <= 0){ k.dead = true; k.active = false; k.x = k.nx = -999; k.y = k.ny = -999; sfx.roar(); setMsg(`${BOSS_NAMES[k.kind]} is DEFEATED! 💥`, 3); }
            bossHp = monsters.filter(m => m.boss).reduce((a, m) => a + m.hp, 0);
            if (bossHp <= 0){ bossHp = 0; stageCleared(); return; }
          }
        } else for (const p of alivePlayers()) if (p.grace <= 0 && Math.hypot(sh.x - p.x, sh.y - p.y) < 16){ shots.splice(i, 1); if (catchPlayer(p, 'fire')) return; break; }
      }
    }
    distTimer -= dt; if (distTimer <= 0){ bfs(); distTimer = 0.15; }
    const base = DIFF[difficulty].spd + STAGES[stage].spd + (stage === 0 ? foundCount*6 : 0);
    for (const m of monsters){
      if (m.dead) continue;
      if (!m.active && m.goon){ m.wake -= dt; if (m.wake <= 0) m.active = true; else continue; }
      if (!m.active){ m.wake -= dt; if (m.wake <= 0){ m.active = true; if (m.big){ sfx.roar(); setMsg(m.boss ? (m.kind === 'king' ? "The DEVIL KING is coming! Press SPACE to shoot! 🏹" : m.kind === 'prince' ? "The DEVIL PRINCE attacks! 🔥" : "The CANDY MAN wants you for dessert! 🍬") : m.king ? "The DEVIL KING is awake... and he's coming for you!" : "ROAR! The bedroom monster is coming! Keep moving!", 3); } } else continue; }
      if (m.stun > 0){ m.stun -= dt; continue; }
      const tx = m.tx*T+T/2, ty = m.ty*T+T/2, dx = tx-m.x, dy = ty-m.y, dl = Math.hypot(dx,dy);
      const ms = (m.goon ? base*0.8 + 30 : (m.chasing ? base : base*0.6) * (m.big ? 1.05 : 1)) * dt;

      else { m.x += dx/dl*ms; m.y += dy/dl*ms; }
      for (const p of alivePlayers()) if (p.grace <= 0 && Math.hypot(m.x-p.x, m.y-p.y) < (m.boss ? 32 : 22)){ if (catchPlayer(p)) return; }
    }
  } else {
    // guest: glide toward what the host says
    for (const m of monsters){ m.x += (m.nx - m.x)*Math.min(1, dt*10); m.y += (m.ny - m.y)*Math.min(1, dt*10); if (m.stun > 0) m.stun -= dt; }
    for (const f of friends){ f.x += (f.nx - f.x)*Math.min(1, dt*10); f.y += (f.ny - f.y)*Math.min(1, dt*10); }
    if (isBoss()){ bossLeft = Math.max(0, bossLeft - dt); for (const sh of shots){ sh.x += sh.vx*dt; sh.y += sh.vy*dt; } }
  }
  // heartbeat when monsters are close to someone on this computer
  let nearest = 1e9;
  for (const m of monsters) if (m.active) for (const p of players) if (p.local && p.alive) nearest = Math.min(nearest, Math.hypot(m.x-p.x, m.y-p.y));
  beatTimer -= dt;
  if (nearest < 200 && beatTimer <= 0){ sfx.beat(); beatTimer = 0.35 + (nearest/200)*0.7; }
  flickNext -= dt;
  if (flickNext <= 0){ flickT = 0.7; flickNext = rand(5,10); sfx.buzz(); }
  if (flickT > 0) flickT -= dt;
}

// ---------- online multiplayer (invite-only rooms) ----------
const net = {
  room: undefined, nr: null, role: null, code: '', pid: Math.random().toString(36).slice(2, 10),
  nick: '', order: [], stTimer: 0, presTimer: 0, myFseq: 0, myRseq: 0, lastFs: 0, lastMsg: 0, unsubs: [], status: '',
  async getRoom(){
    if (this.room !== undefined) return this.room;
    try { this.room = (window.claude && window.claude.use) ? await window.claude.use('room') : null; } catch(e){ this.room = null; }
    return this.room;
  },
  peersList(){ return this.nr ? this.nr.peers().filter(p => p.presence && typeof p.presence.pid === 'string') : []; },
  hostPeer(){ return this.peersList().find(p => p.presence.role === 'host'); },
  nickOf(pid){
    const p = this.peersList().find(q => q.presence.pid === pid);
    const n = p && typeof p.presence.nick === 'string' ? p.presence.nick : 'Friend';
    return n.replace(/[^\p{L}\p{N} _-]/gu, '').slice(0, 12) || 'Friend';
  },
  async join(code, role){
    const room = await this.getRoom();
    if (!room) throw new Error('unavailable');
    this.code = code; this.role = role;

      const bs = monsters.filter(m => m.boss);
      if (Array.isArray(d.bhs)){ bs.forEach((m, i) => { const v = +d.bhs[i]; if (!(v >= 0)) return; if (v < m.hp){ m.hit = 0.15; tone(200, 0.1, 'square', 0.08, 90); } m.hp = v; m.dead = v <= 0; }); bossHp = bs.reduce((a, m) => a + m.hp, 0); }

    }
    if (Array.isArray(d.dc)) decals = d.dc.map(a => ({ x:+a[0], y:+a[1], kid: PLAYER_KIDS[a[2]] || 'You' }));
    if (d.ph === 'win') win();
    else if (d.ph === 'win2') win2();
    else if (d.ph === 'win3') win3();
    else if (d.ph === 'win4') win4();
    else if (d.ph === 'kinglose') kingLose();
    else if (d.ph === 'lose'){ lastCaughtKid = PLAYER_KIDS[d.lk] || 'You'; lose(); }
  },
};

function drawPlayerKid(x,y,k,dir,t,moving,label){
  const sw = moving ? Math.sin(t*14) : 0;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ell(x, y+9, 11, 5);
  ctx.save(); ctx.translate(x,y); ctx.rotate(dir);
  ctx.fillStyle = '#4a3060'; ell(sw*5, -5, 4, 2.6); ell(-sw*5, 5, 4, 2.6);
  ctx.fillStyle = shade(k.pj,-0.2); ell(-sw*4, -10, 3.5, 3); ell(sw*4, 10, 3.5, 3);
  ctx.fillStyle = k.skin; ell(-sw*4+2, -10.5, 2, 2); ell(sw*4+2, 10.5, 2, 2);
  const g = ctx.createRadialGradient(-1,-2,1,0,0,11);
  g.addColorStop(0, shade(k.pj,0.2)); g.addColorStop(1, shade(k.pj,-0.3));
  ctx.fillStyle = g; ell(0, 0, 7, 10.5);
  if (k.style === 'long'){ ctx.fillStyle = k.hair; ell(-7, 0, 4.5, 4); }
  ctx.fillStyle = k.skin; ell(1, 0, 6.8, 6.8);
  ctx.fillStyle = k.hair; ctx.beginPath(); ctx.arc(1, 0, 7.3, Math.PI*0.42, Math.PI*1.58); ctx.closePath(); ctx.fill();
  if (k.style === 'cap'){ ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(1,0,7.4,Math.PI*0.5,Math.PI*1.5); ctx.fill(); ctx.fillStyle = '#8c1015'; ell(6, 0, 3, 5.5); }

  ctx.fillStyle = '#fff'; ell(5, -2.4, 1.6, 1.4); ell(5, 2.4, 1.6, 1.4);
  ctx.fillStyle = '#111'; ell(5.6, -2.4, 0.8, 0.8); ell(5.6, 2.4, 0.8, 0.8);
  ctx.restore();
  if (label){ ctx.font = 'bold 10px "Trebuchet MS", Verdana, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(label, x, y-16); ctx.textAlign = 'left'; }
}
function drawDecal(d){

// ---------- CAUGHT: head-chomp scene ----------
let catchT = 0, chomped = false, chewNext = 0, loseShown = false, splats = [];
function startCaught(){
  state = 'caught'; catchT = 0; chomped = false; chewNext = 0; loseShown = false; splats = [];
  flashBtn.style.display = 'none'; joy.id = null; sfx.roar(); sfx.scream();
}
function drawCaught(dt){
  catchT += dt; const ct = catchT, t = gameT + ct;
  const kx = W/2 - 80, ky = 600, headY = ky - 196, s = 150;
  ctx.fillStyle = '#07040f'; ctx.fillRect(0,0,W,H);
  const lg = ctx.createRadialGradient(kx, ky-160, 20, kx, ky-160, 420);
  lg.addColorStop(0,'rgba(255,200,140,.28)'); lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#1a1020'; ctx.fillRect(0, ky, W, H-ky);
  let mx, my, open, front = false;
  const ease = p => p*p*(3-2*p);
  if (ct < 0.9){ const p = ease(ct/0.9); mx = kx + 260; my = 300 - 30*p; open = 0.4 + p*0.95; }
  else if (ct < 1.15){
    const p = ease((ct-0.9)/0.25); front = true;
    open = 1.35*(1-p); mx = kx + 260 + (kx - (kx+260))*p;
    const tmy = headY - s*0.1 - open*s*0.85; my = 270 + (tmy - 270)*p;
  } else {
    front = true;
    if (!chomped){
      chomped = true; sfx.chomp();
      if (bloodOn) for (let i=0;i<34;i++){ const a = rand(-Math.PI, 0) + rand(-0.4,0.4), v = rand(150,520);
        splats.push({ x:kx, y:headY+30, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:rand(3,10), land:false }); }
    }
    const p = ease(Math.min(1, (ct-1.15)/0.6));
    mx = kx + 250*p; my = (headY - s*0.1) + (290 - (headY - s*0.1))*p;
    open = 0.04 + Math.abs(Math.sin(ct*11))*0.14;
    if (ct > chewNext){ sfx.chew(); chewNext = ct + 0.18; }
  }
  const since = Math.max(0, ct - 1.15);
  const tilt = chomped ? (since > 0.7 ? -Math.min(1.5, (since-0.7)*3) : Math.sin(since*25)*0.04) : 0;
  if (chomped && bloodOn){
    const pr = Math.min(1, since/1.6);
    ctx.fillStyle = '#7d0a12'; ctx.beginPath(); ctx.ellipse(kx - 90*Math.min(1,tilt*-1), ky+4, 30+120*pr, 6+16*pr, 0, 0, Math.PI*2); ctx.fill();
  }
  if (!front) drawMonsterBody(mx, my, s, t, { glow:true, open, lookX:-0.8, lookY:0.6, seed:3 });
  drawStandingKid(kx, ky, { kid: KIDS[lastCaughtKid] || KIDS.You, headless: chomped, t: ct, tilt, blood: bloodOn, since });
  if (front){
    drawMonsterBody(mx, my, s, t, { glow:true, open, lookX:-0.8, lookY:0.4, seed:3, bloody: chomped && bloodOn });
    if (chomped){
      const b = 1 + Math.abs(Math.sin(ct*11))*0.15;
      ctx.fillStyle = 'rgba(20,24,34,.95)';
      ctx.beginPath(); ctx.ellipse(mx - s*0.62, my + s*0.18, s*0.2*b, s*0.16*b, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(mx + s*0.62, my + s*0.18, s*0.2*b, s*0.16*b, 0, 0, Math.PI*2); ctx.fill();
    }
  }
  for (const d of splats){
    if (!d.land){ d.vy += 900*dt; d.x += d.vx*dt; d.y += d.vy*dt; if (d.y > ky + 6){ d.y = ky + 6; d.land = true; } }
    ctx.fillStyle = '#b0101a';
    if (d.land){ ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r*1.8, d.r*0.5, 0, 0, Math.PI*2); ctx.fill(); }
    else circle(d.x, d.y, d.r);
  }
  if (chomped && since < 0.15){ ctx.fillStyle = bloodOn ? `rgba(200,0,0,${0.6-since*4})` : `rgba(255,255,255,${0.7-since*4})`; ctx.fillRect(0,0,W,H); }
  if (chomped){
    const pop = Math.min(1, since*5), sc = 0.6 + pop*0.5 + Math.sin(ct*8)*0.03;
    ctx.save(); ctx.translate(W/2, 110); ctx.scale(sc, sc); ctx.rotate(-0.06);

    ctx.lineWidth = 10; ctx.strokeStyle = '#000'; ctx.strokeText('CHOMP!', 0, 0);

    ctx.restore(); ctx.textAlign = 'left';
  }
  if (ct > 3.0 && !loseShown){ loseShown = true; showLose(); }
}

// ---------- title background ----------
function drawMenuBg(t){
  ctx.fillStyle = '#0a0718'; ctx.fillRect(0,0,W,H);
  for (let i=0;i<4;i++){
    const x = 120 + i*240 + Math.sin(t*0.7+i)*40, y = 330 + Math.cos(t*0.9+i*2)*60;
    drawMonsterEyes(x, y, 40, t + i*3, { glow:true, lookX:Math.sin(t+i), lookY:0.3, seed:i*2 });
  }
}

// ---------- main loop ----------
let last = performance.now(), menuT = 0;
function frame(now){
  setMusic(desiredMusic());
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  ctx.clearRect(0,0,W,H); ctx.save();
  if (state === 'menu' || state === 'lobby'){ menuT += dt; drawMenuBg(menuT); }
  else if (state === 'intro') drawIntro(dt);
  else if (state === 'stagecard') drawStageCard(dt);
  else if (state === 'play'){ update(dt); drawGame(state === 'play' ? dt : 0); }
  else if (state === 'caught') drawCaught(dt);
  else if (state === 'over'){ if (catchT > 0) drawCaught(dt); else drawGame(0); }
  else if (state === 'win') drawMenuBg(menuT += dt);
  ctx.restore();
  requestAnimationFrame(frame);
}
menu();
requestAnimationFrame(frame);
// test hook
window.__game = { get state(){ return state; }, startGame, get player(){ return player; }, get players(){ return players; }, get friends(){ return friends; }, get monsters(){ return monsters; }, setMode(m){ mode = m; }, get stage(){ return stage; }, get items(){ return items; }, get doorPos(){ return doorPos; }, get fx(){ return state === "intro" && scenes[introStep] ? scenes[introStep].fx : null; }, get bossHp(){ return bossHp; }, set bossHp(v){ bossHp = v; }, set bossLeft(v){ bossLeft = v; }, get boss(){ return isBoss(); } };
})();
