<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="funkid.app">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd7ff"/><stop offset=".45" stop-color="#1f6cf0"/><stop offset="1" stop-color="#1a1f8c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df3ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ff7ae6"/>
    </linearGradient>
    <filter id="glowP" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowB" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#2fb8ff"/><feComposite in2="b" operator="in" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowT" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="arc" d="M68,292 A194,194 0 0 1 456,292"/>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0c0a22"/>
  <!-- lightning behind -->
  <g filter="url(#glowP)" fill="#ff2fd6">
    <path d="M378,214 L462,150 L428,206 L486,184 L404,262 L436,248 L360,330 Z"/>
    <path d="M346,350 L420,300 L392,352 L446,330 L330,452 L356,392 L312,410 Z"/>
  </g>
  <!-- ring -->
  <circle cx="262" cy="292" r="146" fill="none" stroke="#ff2fd6" stroke-width="16" filter="url(#glowP)"/>
  <circle cx="262" cy="292" r="146" fill="none" stroke="#ffb3f1" stroke-width="4"/>
  <!-- head silhouette -->
  <g filter="url(#glowB)">
  <path fill="url(#fur)" stroke="#06081f" stroke-width="7" stroke-linejoin="round" d="
    M126,262 C134,240 158,222 188,212 C198,190 210,176 226,168 C222,150 226,136 240,134 C254,134 266,146 272,154
    C290,146 306,147 320,152 C326,138 340,128 352,134 C362,142 362,164 356,180 C378,206 390,246 386,286
    C382,332 356,372 314,402 L262,410 C236,408 214,398 202,384
    L176,362 C164,330 150,304 140,286 C132,280 127,272 126,262 Z"/>
  </g>
  <!-- ear insides -->
  <path d="M240,146 C236,154 238,162 242,166 L260,154 C254,148 248,144 240,146 Z" fill="#ff2fd6" opacity=".85"/>
  <path d="M350,144 C356,152 354,164 350,172 L332,156 C336,150 342,144 350,144 Z" fill="#ff2fd6" opacity=".85"/>
  <!-- fur highlights -->
  <g fill="none" stroke="#7df3ff" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M206,200 C236,176 280,166 320,176"/>
    <path d="M300,196 C330,200 352,222 360,250"/>
    <path d="M318,250 C340,270 346,300 338,330"/>
    <path d="M290,300 C312,318 318,344 306,372"/>
    <path d="M170,236 C190,230 210,232 226,240"/>
  </g>
  <g fill="none" stroke="#0b1a5c" stroke-width="4" stroke-linecap="round">
    <path d="M330,210 l14,8 M342,236 l16,4 M350,268 l14,0 M348,300 l14,-4 M336,334 l14,-8 M320,364 l12,-10"/>
  </g>
  <!-- brow -->
  <path d="M206,214 C224,196 252,190 280,198 L262,210 C246,206 228,210 214,222 Z" fill="#06081f"/>
  <!-- eye -->
  <g filter="url(#glowP)">
    <path d="M222,226 C238,212 260,208 276,212 C262,226 242,232 222,226 Z" fill="#ff4fe0"/>
  </g>
  <path d="M232,224 C244,216 258,214 268,215 C258,222 246,226 232,224 Z" fill="#fff"/>
  <!-- muzzle wrinkles -->
  <g fill="none" stroke="#06081f" stroke-width="4" stroke-linecap="round">
    <path d="M150,244 C160,236 172,232 184,232"/>
    <path d="M158,256 C170,248 184,246 196,248"/>
  </g>
  <!-- nose -->
  <path d="M118,256 C124,244 142,242 150,252 C148,264 136,272 124,270 Z" fill="#ff6fc8" stroke="#06081f" stroke-width="4"/>
  <!-- mouth -->
  <path d="M138,284 C172,290 214,300 252,316 C234,346 210,360 182,362 C168,334 154,306 138,284 Z" fill="#3a0024" stroke="#06081f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M190,334 C206,344 220,342 236,332" fill="none" stroke="#c2185b" stroke-width="10" stroke-linecap="round"/>
  <!-- teeth -->
  <g fill="#f2f6ff" stroke="#06081f" stroke-width="3" stroke-linejoin="round">
    <path d="M148,288 L162,292 L156,322 Z"/>
    <path d="M200,300 L214,304 L206,330 Z"/>
    <path d="M170,294 L180,296 L176,308 Z"/>
    <path d="M222,306 L232,310 L227,320 Z"/>
    <path d="M182,358 L196,358 L192,332 Z"/>
    <path d="M216,352 L228,346 L226,330 Z"/>
  </g>
  <!-- whisker dots -->
  <g fill="#06081f"><circle cx="160" cy="272" r="3"/><circle cx="172" cy="276" r="3"/><circle cx="168" cy="266" r="3"/></g>
  <text font-family="'Arial Black','Trebuchet MS',Verdana,sans-serif" font-weight="900" font-size="60" letter-spacing="2" fill="url(#txt)" stroke="#ff2fd6" stroke-width="5" stroke-linejoin="round" paint-order="stroke" filter="url(#glowT)" text-anchor="middle"><textPath href="#arc" startOffset="50%">funkid.app</textPath></text>
</svg>
